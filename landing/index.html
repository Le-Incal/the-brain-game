<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Game · A Study in Cognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />

  <body>
    <main class="landing">
      <div class="landing-spread">
      <figure class="plate-figure">
        <div class="plate" data-plate="tinted" role="img" aria-label="An engraved side elevation of the left hemisphere of the human brain, coloured by region. Drag to turn it.">
          <div class="plate-canvas"></div>
        </div>
      </figure>
      <section class="landing-text">
        <header>
          <h1>BRAIN GAME</h1>
          <p class="landing-subtitle">A Study in Cognition</p>
        </header>
        <p class="landing-voice">
          <span>This is embodied AI as the Human Brain. Speak and interact to explore the anatomy and functional regions of the brain.</span>
          <span>Turn on your speaker&nbsp;and&nbsp;mic for the best experience.</span>
        </p>
        <div class="landing-enter">
          <a class="enter" href="/app"><span class="enter-hand" aria-hidden="true">☞</span><span class="enter-word">Enter</span></a>
        </div>
      </section>
      </div>
    </main>
    <script type="module" src="/src/landing/landing.js"></script>
