<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Game · A Study in Cognition</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="landing">
      <figure class="plate-figure">
        <div class="plate" data-plate="ink" role="img" aria-label="An engraved side elevation of the left hemisphere of the human brain. Drag to turn it.">
          <div class="plate-canvas"></div>
          <svg class="plate-leaders" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <figcaption>Fig. 1. The left hemisphere, in side elevation. Drag to turn it.</figcaption>
      </figure>
      <section class="landing-text">
        <div class="plate-number"><span>Plate I</span><span aria-hidden="true"></span></div>
        <header>
          <h1>BRAIN GAME</h1>
          <p class="landing-subtitle">A Study in Cognition</p>
        </header>
        <p class="landing-voice">I am a human brain. Turn me in your hands, ask me what each part of me does, and I will answer you aloud.</p>
        <aside class="landing-note">
          <span>A note on sound</span>
          <p>I speak, and I listen. When you enter, your browser will ask to let me hear you.</p>
        </aside>
        <div class="landing-enter">
          <a class="enter" href="/">Enter</a>
          <p>or press <kbd>Enter</kbd></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/landing/landing.js"></script>
  </body>
</html>
