<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Game — A Study in Cognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #ffffff; }
      @keyframes wordAbsorb {
        from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        to { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
      }
      .word-absorb {
        animation: wordAbsorb 480ms ease-in forwards;
      }
      .brain-annotation {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        white-space: nowrap;
      }
      .brain-annotation__leader {
        width: 18px;
        height: 1px;
        background: #1a1814;
        opacity: 0.45;
        flex-shrink: 0;
      }
      .brain-annotation__text {
        font-family: 'EB Garamond', Georgia, serif;
        font-style: italic;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #2a2820;
        text-shadow: 0 0 6px #fff, 0 0 12px #fff;
      }
      @media (max-width: 640px) {
        .brain-annotation__text { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
