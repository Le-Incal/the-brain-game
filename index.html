<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Game — A Study in Cognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f7f0dc;
      }
      @supports (height: 100dvh) {
        html, body, #root { height: 100dvh; }
      }
      @keyframes wordAbsorb {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          filter: blur(0);
        }
        55% {
          opacity: 0.88;
          transform: translate(-50%, -50%) scale(0.46);
          filter: blur(0.4px);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.04);
          filter: blur(2.5px);
        }
      }
      .word-absorb {
        transform-origin: center;
        animation: wordAbsorb 480ms cubic-bezier(0.55, 0, 1, 0.45) forwards;
      }
      @keyframes titleFoldUp {
        from {
          opacity: 1;
          transform: translateY(0) scaleY(1);
        }
        to {
          opacity: 0;
          transform: translateY(-34px) scaleY(0.18);
        }
      }
      .title-fold-up {
        transform-origin: top center;
        animation: titleFoldUp 520ms cubic-bezier(0.55, 0, 1, 0.45) 350ms forwards;
      }
      .brain-annotation {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        white-space: nowrap;
      }
      .brain-annotation__leader {
        width: 18px;
        height: 1.5px;
        background: #1a1814;
        opacity: 0.62;
        flex-shrink: 0;
      }
      .brain-annotation__text {
        font-family: 'EB Garamond', Georgia, serif;
        font-style: italic;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #2a2820;
        text-shadow: 0 0 6px #fff, 0 0 12px #fff;
      }
      .speed-slider {
        appearance: none;
        -webkit-appearance: none;
        height: 10px;
        background: transparent;
      }
      .speed-slider::-webkit-slider-runnable-track {
        height: 3px;
        background: #000;
      }
      .speed-slider::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 7px;
        height: 7px;
        margin-top: -2px;
        border: 0;
        border-radius: 50%;
        background: #000;
      }
      .speed-slider::-moz-range-track {
        height: 3px;
        border: 0;
        background: #000;
      }
      .speed-slider::-moz-range-thumb {
        width: 7px;
        height: 7px;
        border: 0;
        border-radius: 50%;
        background: #000;
      }
      .mobile-primary-control {
        display: none;
      }
      @media (max-width: 960px) {
        .description-panel {
          top: auto !important;
          bottom: 62px !important;
          transform: none !important;
          width: min(300px, calc(100vw - 48px)) !important;
        }
      }
      @media (max-width: 640px) {
        .mobile-settings-toggle {
          display: flex !important;
          top: calc(env(safe-area-inset-top, 0px) + 12px) !important;
        }
        .mobile-settings-panel {
          display: none !important;
          position: absolute;
          top: calc(env(safe-area-inset-top, 0px) + 58px);
          right: 14px;
          z-index: 13;
          width: 216px;
          padding: 10px;
          flex-direction: column;
          gap: 10px;
          background: rgba(247, 240, 220, 0.97);
          border: 1px solid #1a1814;
          box-shadow:
            inset 0 0 0 3px #f7f0dc,
            inset 0 0 0 4px rgba(26, 24, 20, 0.24),
            3px 3px 0 rgba(26, 24, 20, 0.18);
        }
        .mobile-settings-panel.is-open {
          display: flex !important;
        }
        .app-title {
          font-size: 27px !important;
          letter-spacing: 0.13em !important;
        }
        .app-subtitle {
          font-size: 13px !important;
          letter-spacing: 0.08em !important;
        }
        .brain-annotation__text { font-size: 10px; }
        .description-panel {
          left: 16px !important;
          top: 108px !important;
          bottom: auto !important;
          width: calc(100vw - 32px) !important;
          max-height: 220px;
          overflow: hidden;
          padding: 8px 10px;
          background: rgba(247, 240, 220, 0.92);
          border-top: 1px solid rgba(26, 24, 20, 0.24);
          border-bottom: 1px solid rgba(26, 24, 20, 0.24);
        }
        .instruction-body {
          font-size: 12px !important;
          line-height: 1.3 !important;
        }
        .region-description {
          font-size: 11.5px !important;
          line-height: 1.3 !important;
          letter-spacing: 0.02em !important;
        }
        .game-controls {
          bottom: calc(env(safe-area-inset-bottom, 0px) + 10px) !important;
          gap: 5px !important;
          left: 10px !important;
          right: 62px;
          width: auto;
          max-width: none !important;
          transform: none !important;
          padding: 0 !important;
          flex-wrap: nowrap !important;
          justify-content: flex-start !important;
        }
        .game-controls .mobile-primary-control {
          display: block;
        }
        .game-controls .primary-game-control {
          background: #1a1814 !important;
          color: #f5f0e8 !important;
        }
        .game-controls button {
          font-size: 8px !important;
          padding: 3px 7px !important;
          letter-spacing: 0.06em !important;
        }
        .mobile-settings-panel .difficulty-controls {
          position: static !important;
          gap: 4px !important;
          justify-content: space-between;
        }
        .difficulty-controls > span {
          font-size: 10px !important;
          letter-spacing: 0.06em !important;
        }
        .difficulty-controls button {
          padding: 2px 5px !important;
          font-size: 7px !important;
        }
        .mobile-settings-panel .right-controls {
          position: static !important;
          gap: 7px !important;
        }
        .speed-control { gap: 3px !important; }
        .speed-label {
          display: inline !important;
          min-width: 48px;
        }
        .speed-slider {
          width: 112px !important;
          flex: 1;
        }
        .speed-value {
          min-width: 22px !important;
          font-size: 9px !important;
        }
        .score-display {
          right: 10px !important;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 13px) !important;
          font-size: 10px !important;
          letter-spacing: 0.06em !important;
        }
        .game-prompt {
          top: calc(50% + 70px) !important;
        }
        .countdown-prompt {
          top: calc(env(safe-area-inset-top, 0px) + 58px) !important;
        }
        .ready-prompt {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
