<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Game — A Study in Cognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f7f0dc;
      }
      @keyframes wordAbsorb {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          filter: blur(0);
        }
        55% {
          opacity: 0.88;
          transform: translate(-50%, -50%) scale(0.46);
          filter: blur(0.4px);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.04);
          filter: blur(2.5px);
        }
      }
      .word-absorb {
        transform-origin: center;
        animation: wordAbsorb 480ms cubic-bezier(0.55, 0, 1, 0.45) forwards;
      }
      @keyframes titleFoldUp {
        from {
          opacity: 1;
          transform: translateY(0) scaleY(1);
        }
        to {
          opacity: 0;
          transform: translateY(-34px) scaleY(0.18);
        }
      }
      .title-fold-up {
        transform-origin: top center;
        animation: titleFoldUp 520ms cubic-bezier(0.55, 0, 1, 0.45) 350ms forwards;
      }
      .brain-annotation {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        white-space: nowrap;
      }
      .brain-annotation__leader {
        width: 18px;
        height: 1.5px;
        background: #1a1814;
        opacity: 0.62;
        flex-shrink: 0;
      }
      .brain-annotation__text {
        font-family: 'EB Garamond', Georgia, serif;
        font-style: italic;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #2a2820;
        text-shadow: 0 0 6px #fff, 0 0 12px #fff;
      }
      .speed-slider {
        appearance: none;
        -webkit-appearance: none;
        height: 10px;
        background: transparent;
      }
      .speed-slider::-webkit-slider-runnable-track {
        height: 3px;
        background: #000;
      }
      .speed-slider::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 7px;
        height: 7px;
        margin-top: -2px;
        border: 0;
        border-radius: 50%;
        background: #000;
      }
      .speed-slider::-moz-range-track {
        height: 3px;
        border: 0;
        background: #000;
      }
      .speed-slider::-moz-range-thumb {
        width: 7px;
        height: 7px;
        border: 0;
        border-radius: 50%;
        background: #000;
      }
      @media (max-width: 640px) {
        .brain-annotation__text { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
