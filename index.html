<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Game — A Study in Cognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f7f0dc;
      }
      @supports (height: 100dvh) {
        html, body, #root { height: 100dvh; }
      }
      @keyframes wordAbsorb {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          filter: blur(0);
        }
        55% {
          opacity: 0.88;
          transform: translate(-50%, -50%) scale(0.46);
          filter: blur(0.4px);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.04);
          filter: blur(2.5px);
        }
      }
      .word-absorb {
        transform-origin: center;
        animation: wordAbsorb 480ms cubic-bezier(0.55, 0, 1, 0.45) forwards;
      }
      @keyframes titleFoldUp {
        from {
          opacity: 1;
          transform: translateY(0) scaleY(1);
        }
        to {
          opacity: 0;
          transform: translateY(-34px) scaleY(0.18);
        }
      }
      .title-fold-up {
        transform-origin: top center;
        animation: titleFoldUp 520ms cubic-bezier(0.55, 0, 1, 0.45) 350ms forwards;
      }
      .speed-slider {
        appearance: none;
        -webkit-appearance: none;
        height: 10px;
        background: transparent;
      }
      .speed-slider::-webkit-slider-runnable-track {
        height: 3px;
        background: #000;
      }
      .speed-slider::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 7px;
        height: 7px;
        margin-top: -2px;
        border: 0;
        border-radius: 50%;
        background: #000;
      }
      .speed-slider::-moz-range-track {
        height: 3px;
        border: 0;
        background: #000;
      }
      .speed-slider::-moz-range-thumb {
        width: 7px;
        height: 7px;
        border: 0;
        border-radius: 50%;
        background: #000;
      }
      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .guide-quill svg {
        display: block;
        height: 100%;
        width: auto;
      }
      .guide-quill { opacity: 0.82; transition: opacity 0.2s ease; }
      .guide-write:focus-within { border-bottom-color: #1a1814 !important; }
      .guide-write:focus-within .guide-quill { opacity: 1; }
      .guide-write input::placeholder {
        color: rgba(26, 24, 20, 0.62);
        font-style: italic;
      }
      .guide-transcript::-webkit-scrollbar { width: 3px; }
      .guide-transcript::-webkit-scrollbar-thumb { background: rgba(26, 24, 20, 0.35); border-radius: 2px; }
      .guide-transcript::-webkit-scrollbar-track { background: transparent; }
      .guide-transcript:focus-visible { outline: 1px dotted rgba(26, 24, 20, 0.5) !important; outline-offset: 4px; }
      .guide-switch:focus-visible, .guide-notice:focus-visible, .guide-latest:focus-visible {
        outline: 1px dotted #1a1814;
        outline-offset: 3px;
      }
      @media (max-width: 960px) {
        .description-panel {
          top: auto !important;
          bottom: 62px !important;
          transform: none !important;
          width: min(300px, calc(100vw - 48px)) !important;
        }
      }
      @media (min-width: 641px) and (max-width: 960px) {
        .arrival-panel {
          top: auto !important;
          bottom: 62px !important;
          width: min(300px, calc(100vw - 48px)) !important;
        }
        .arrival-panel[data-region="named"] ~ .description-panel {
          bottom: 280px !important;
        }
        .arrival-panel[data-region="described"] {
          display: none !important;
        }
      }
      @media (min-width: 961px) {
        .arrival-panel ~ .description-panel {
          top: auto !important;
          transform: none !important;
          bottom: calc(clamp(18px, 3vh, 28px) + 342px) !important;
        }
      }
      @media (max-width: 640px) {
        .app-title {
          font-size: 27px !important;
          letter-spacing: 0.13em !important;
        }
        .app-subtitle {
          font-size: 13px !important;
          letter-spacing: 0.08em !important;
        }
        .description-panel {
          left: 16px !important;
          top: 108px !important;
          bottom: auto !important;
          width: calc(100vw - 32px) !important;
          max-height: 220px;
          overflow: hidden;
          padding: 8px 10px;
          background: rgba(247, 240, 220, 0.92);
          border-top: 1px solid rgba(26, 24, 20, 0.24);
          border-bottom: 1px solid rgba(26, 24, 20, 0.24);
        }
        /*
         * Kyle, 2026-10-17: "Region descriptions need to become compact ...
         * when a region is selected the title and header are replaced with the
         * description." The name on the title's line, the text under it.
         */
        .description-panel[data-place="header"] {
          top: clamp(16px, 3vh, 28px) !important;
          max-height: none;
          padding: 0 2px;
          background: transparent;
          border: none;
        }
        .description-panel[data-place="header"] .region-description {
          font-size: 12.5px !important;
          letter-spacing: 0.02em !important;
          margin-bottom: 0 !important;
        }
        .region-title,
        .region-name {
          display: inline !important;
        }
        .description-panel[data-place="header"] .region-title {
          font-size: 16px;
        }
        .region-name {
          margin-top: 0 !important;
        }
        .region-name::before {
          content: '·';
          margin: 0 0.45em;
        }
        .region-text {
          margin-top: 4px !important;
          line-height: 1.35 !important;
          letter-spacing: 0.01em !important;
        }
        .settings-panel {
          bottom: calc(env(safe-area-inset-bottom, 0px) + 44px) !important;
          min-width: 0 !important;
          width: calc(100vw - 32px);
        }
        /* Kyle, 2026-10-17: every button in Settings the same size. */
        .settings-panel button {
          width: 52px;
          box-sizing: border-box;
          text-align: center;
          padding: 3px 0 !important;
        }
        /*
         * Kyle, 2026-10-18: finer lines round Settings and the buttons. A
         * 0.5 px hairline drawn inside the edge, one device pixel on a 2x
         * screen, in place of the 1 px border (the padding above keeps their size).
         */
        .settings-panel {
          border: none !important;
          box-shadow: inset 0 0 0 0.5px #1a1814, 2px 2px 0 rgba(26, 24, 20, 0.12) !important;
        }
        .settings-panel button,
        .game-controls button {
          border: none !important;
          box-shadow: inset 0 0 0 0.5px #1a1814 !important;
        }
        .region-description {
          font-size: 11.5px !important;
          line-height: 1.3 !important;
          letter-spacing: 0.02em !important;
        }
        .game-controls {
          bottom: calc(env(safe-area-inset-bottom, 0px) + 10px) !important;
          gap: 5px !important;
          left: 10px !important;
          right: 10px;
          width: auto;
          overflow-x: auto;
          max-width: none !important;
          transform: none !important;
          padding: 0 !important;
          flex-wrap: nowrap !important;
          justify-content: flex-start !important;
        }
        .game-controls button {
          font-size: 8px !important;
          padding: 4px 8px !important;
          letter-spacing: 0.06em !important;
        }
        /*
         * Kyle, 2026-10-17: "move the buttons for Study, Play, and Settings
         * together in that order at the right hand side. And move the toggles
         * down in line with the buttons." The score sits just left of them.
         */
        .game-controls {
          justify-content: flex-end !important;
          overflow: visible !important;
        }
        .game-controls .bar-study { order: 2; }
        .game-controls .bar-play { order: 3; }
        .game-controls .bar-settings { order: 4; }
        /* The column ends 34 px above the bar's line; its switches drop onto it, centred on the buttons, at the bar's margin. */
        .guide-switches {
          position: absolute;
          left: -6px;
          bottom: -37.5px;
          margin: 0 !important;
          align-items: center;
        }
        .guide-column {
          top: auto !important;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 44px) !important;
          left: 16px !important;
          right: 16px !important;
          width: auto !important;
          max-height: 40vh;
        }
        /* Kyle, 2026-10-17: "Limit text streaming to 3 lines." */
        .guide-transcript {
          max-height: 66px !important;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px) !important;
          mask-image: linear-gradient(to bottom, transparent 0, #000 10px) !important;
        }
        .guide-transcript > div { padding-top: 0 !important; }
        .guide-line, .visitor-line {
          font-size: 14px !important;
          line-height: 1.5 !important;
          margin-bottom: 3px !important;
        }
        .speed-control { gap: 3px !important; }
        .speed-label {
          display: inline !important;
          min-width: 48px;
        }
        .speed-slider {
          width: 112px !important;
          flex: 1;
        }
        .speed-value {
          min-width: 22px !important;
          font-size: 9px !important;
        }
        .score-display {
          font-size: 10px !important;
          letter-spacing: 0.06em !important;
        }
        .game-prompt {
          top: calc(50% + 70px) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
