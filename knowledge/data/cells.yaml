  text:
    curious: Neurons that release acetylcholine. In the brain they sit in the basal forebrain and in nuclei of the pons, and they help keep the cortex awake and support attention and memory.
  notes: Basal forebrain acetylcholine neurons decline in Alzheimer's disease, but this is a consequence, not the cause. Basal forebrain containment held back pending structure:basal-forebrain.
