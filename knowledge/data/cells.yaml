- id: celltype:purkinje
  class: CellType
  label: Purkinje Cell
  kind: neuron
  pronunciation:
    respelling: pur-KIN-jee
  text:
    child: Big, fan-shaped cells in my cerebellum. They gather huge amounts of information and send calming signals that keep your movements smooth.
    curious: Purkinje cells carry every signal that leaves the cerebellar cortex. Each has a flat, fan-like dendritic tree that can receive up to about 200,000 parallel-fibre inputs. They release GABA, so their message is inhibitory, and lasting changes at their synapses help you learn and fine-tune movements.
  quantities:
  - name: parallelFibreSynapsesPerCell
    value: 200000
    unit: synapses
    approx: true
    sources:
    - source:kandel-pns
    - source:qbi-brain-basics
    note: Up to about 200,000 per cell.
  notes: Purkinje cells send inhibition to the deep cerebellar nuclei, which are the cerebellum's main output stations. A subset in the flocculonodular lobe and vermis bypasses those nuclei and projects straight to the vestibular nuclei.
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    - source:qbi-brain-basics
    - source:brainfacts
    locator: R1 §1.19 Cerebellum (Anatomy); R1 §17c Glossary (Purkinje cell); KB cells/neuron_types.md (Signature neurons); KB anatomy/hindbrain.md (For the expert); R2 B2 Cerebro-cerebellar loop
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: celltype:cerebellar-granule-cell
  class: CellType
  label: Cerebellar Granule Cell
  kind: neuron
  text:
    child: Tiny cells packed by the billions into my cerebellum. There are more of them than any other kind of neuron in me.
    curious: Most of the cerebellum's roughly 69 billion neurons are granule cells, so no other neuron type in the brain is more plentiful. Unusually, the majority are generated after birth, within the first year of life. They are driven by mossy fibres, and their parallel fibres use glutamate to excite Purkinje cells.
  provenance:
    sources:
    - source:azevedo-2009
    - source:kandel-pns
    - source:purves-neuroscience
    - source:qbi-brain-basics
    - source:brainfacts
    locator: R1 §1.19 Cerebellum (What); R2 B2 Cerebro-cerebellar loop; KB physiology/neurogenesis.md (Before birth); KB SOURCES_AND_CORRECTIONS.md (Independent fact-check)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: celltype:interneuron
  class: CellType
  label: Interneuron
  kind: neuron
  pronunciation:
    respelling: IN-ter-noor-on
  text:
    child: Connector neurons that link other neurons together and help shape the timing of their signals.
    curious: This term is used in two ways. In the broad sense it covers every neuron that is not sensory or motor, which is by far the brain's biggest group. In the narrow sense it means local circuit neurons, roughly a fifth of cortical neurons; most are inhibitory, release GABA and tune timing and rhythm. Some inhibitory interneurons in the spinal cord release glycine.
  quantities:
  - name: shareOfCorticalNeurons
    value: 20
    unit: percent
    approx: true
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    note: Local (narrow-sense) interneurons of the cortex.
  notes: 'Two senses: broad (any neuron neither sensory nor motor) and narrow (local circuit cell). RELEASES assertions refer to the narrow, local sense.'
  provenance:
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: KB cells/neuron_types.md (How they function; Projection neurons vs local interneurons); R2 B9 Spinal reflex arcs; KB physiology/neurotransmitters.md (Glycine)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
