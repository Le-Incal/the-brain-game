- id: celltype:dopaminergic-neuron
  class: CellType
  label: Dopamine Neuron
  kind: neuron
  aliases:
  - text: dopaminergic neuron
    kind: common
  text:
    child: Neurons deep in my midbrain that make dopamine, a chemical that helps you move smoothly and learn what is worth doing again.
    curious: 'Dopamine neurons cluster in the substantia nigra and the ventral tegmental area of the midbrain. Nigral cells feed the striatum and support movement; losing them causes Parkinson''s disease. VTA cells reach reward and frontal areas. Their firing tracks surprise: a burst for an unexpected reward, a dip when an expected one fails to come.'
  notes: Substantia nigra dopamine neurons contain the dark pigment neuromelanin.
  provenance:
    sources:
    - source:qbi-brain-basics
    - source:brainfacts
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    - source:schultz-1997
