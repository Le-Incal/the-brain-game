    curious: 'A lasting weakening of a synapse. It is not simple disuse: it needs particular activity patterns, such as modest calcium rises through NMDA receptors. In the cerebellum, weakening of the synapses between parallel fibres and Purkinje cells is a basis for learning movements.'
