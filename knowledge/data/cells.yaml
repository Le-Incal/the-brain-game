# Brain Game knowledge base: cells. Extracted 2026-10-02; every record is proposed until the steward approves it.
nodes:
- id: celltype:neuron
  class: CellType
  label: Neuron
  kind: neuron
  aliases:
  - text: nerve cell
    kind: common
  pronunciation:
    respelling: NOOR-on
  text:
    child: Neurons are my messenger cells. Each one gathers signals on its branches and, when enough arrive, fires a quick electric pulse down a long wire.
    curious: A neuron collects input on branching dendrites, adds it up in the cell body and, if the total crosses a threshold, fires a pulse along its axon. At the axon tips the pulse becomes a chemical message for the next cell. I hold about 86 billion neurons, and most of them are packed into my cerebellum.
    expert: 'Isotropic fractionation of four adult male brains gave about 86 billion neurons, with individual brains between 78.8 and 95.4 billion: roughly 69 billion in the cerebellum and 16 billion in the cerebral cortex. The popular figure of 100 billion falls outside the measured range. Synapses form on dendritic spines, cell bodies and axon initial segments, and whole-brain synapse estimates span about 100 to 1,000 trillion. Most neurons are never replaced, and many neurons release more than one transmitter.'
  quantities:
  - name: neuronCount
    value: 86000000000
    unit: neurons
    approx: true
    sources:
    - source:azevedo-2009
    low: 78800000000
    high: 95400000000
    note: Four adult male brains aged 50 to 71 (86.1 plus or minus 8.1 billion); low and high are the individual-brain extremes.
  - name: cerebellarNeuronCount
    value: 69000000000
    unit: neurons
    approx: true
    sources:
    - source:azevedo-2009
    note: Roughly 80 percent of all neurons; most are cerebellar granule cells.
  - name: corticalNeuronCount
    value: 16000000000
    unit: neurons
    approx: true
    sources:
    - source:azevedo-2009
    note: Cerebral cortex.
  - name: totalSynapseCount
    value: 100000000000000
    unit: synapses
    approx: true
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    low: 100000000000000
    high: 1000000000000000
    note: Estimates range from about 100 to 1,000 trillion; value is the low end of the stated range.
  notes: Say about 86 billion and never 100 billion; Lent et al. 2012 point out that 100 billion falls beyond the measured range. A neuron often releases several transmitters, yet Dale's principle (each cell uses the same transmitter set at every terminal) mostly still applies. A few neurons, retinal amacrine cells among them, have no classic axon.
  provenance:
    sources:
    - source:azevedo-2009
    - source:lent-2012
    - source:qbi-brain-basics
    - source:brainfacts
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: KB cells/neuron.md; R1 TL;DR; R1 Key Findings (Neuron and glia counts); R1 §17c Glossary (Neuron); KB physiology/how_neurons_signal.md (Scale)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: celltype:glia
  class: CellType
  label: Glia
  kind: glia
  aliases:
  - text: glial cells
    kind: common
  pronunciation:
    respelling: GLEE-uh
  text:
    child: My glia are little helpers. They feed and guard my nerve cells, clear away rubbish, fight off germs and coat my wires so signals zoom along.
    curious: Glia are all the nervous-system cells that are not neurons. They do not usually fire spikes, yet they manage the chemistry around synapses, insulate axons, defend against infection and help build the brain. Across my whole brain there is roughly one glial cell per neuron, not the ten to one that older books repeat.
    expert: Central types are astrocytes, oligodendrocytes, microglia, ependymal cells and oligodendrocyte precursor (NG2) cells, with specialists such as Bergmann glia, Muller glia and tanycytes; Schwann cells myelinate peripheral nerves. Microglia come from yolk-sac immune precursors, not neural progenitors. The whole-brain glia-to-neuron ratio is near 1:1, but outside the cerebellum, where granule cells dominate the neuron count, it can reach about 4:1. Glia signal through calcium waves and gliotransmitters, and most primary malignant brain tumours arise from glial lineages.
  quantities:
  - name: gliaToNeuronRatio
    value: 1
    unit: ratio
    approx: true
    sources:
    - source:azevedo-2009
    - source:von-bartheld-2016
    note: Whole brain, roughly 1:1; varies by region. The 10:1 figure is a myth.
  - name: gliaToNeuronRatioOutsideCerebellum
    value: 4
    unit: ratio
    approx: true
    sources:
    - source:von-bartheld-2016
    note: Upper figure (up to about 4:1) for the brain excluding the cerebellum.
  - name: nonNeuronalCellCount
    value: 85000000000
    unit: cells
    approx: true
    sources:
    - source:azevedo-2009
    note: Azevedo counted non-neuronal cells, a category not limited to glia.
  provenance:
    sources:
    - source:azevedo-2009
    - source:von-bartheld-2016
    - source:qbi-brain-basics
    - source:brainfacts
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: KB cells/glia.md; R1 Key Findings (Neuron and glia counts); R1 §17a Myths 8; R1 §17c Glossary (Glia); KB SOURCES_AND_CORRECTIONS.md (QBI What is a neuron?)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: celltype:pyramidal-neuron
  class: CellType
  label: Pyramidal Neuron
  kind: neuron
  aliases:
  - text: pyramidal cell
    kind: common
  pronunciation:
    respelling: pih-RAM-ih-dal
  text:
    child: Cone-shaped neurons that make up most of my outer layer. Their long wires carry go signals to faraway brain areas.
    curious: Pyramidal neurons are the main projection cells of the cortex, about four in every five cortical neurons. Their long axons excite distant targets with glutamate, and one cell can carry thousands of synapses. They fill layers II, III and V, and the giant Betz cells of my motor strip are an extreme example.
  quantities:
  - name: shareOfCorticalNeurons
    value: 80
    unit: percent
    approx: true
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    note: Cortical projection neurons; local interneurons make up the remaining roughly 20 percent.
  - name: synapsesPerCell
    value: 10000
    unit: synapses
    approx: true
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    note: Stated as several thousand to over ten thousand for a typical cortical pyramidal neuron.
  provenance:
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: KB cells/neuron_types.md (Projection neurons vs local interneurons); R2 C1 The six neocortical layers; KB physiology/how_neurons_signal.md (Scale); KB SOURCES_AND_CORRECTIONS.md (How do neurons work?)
