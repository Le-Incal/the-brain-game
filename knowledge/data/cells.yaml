requests:
- wanted: structure:basal-forebrain
  label: Basal forebrain
  why: Source of brain acetylcholine (R2 B11; R1 §4; KB physiology/neurotransmitters.md). Would carry CONTAINS_CELL basal-forebrain to celltype:cholinergic-neuron and PRODUCED_IN acetylcholine to basal-forebrain, both held back.
- wanted: structure:subventricular-zone
  label: Subventricular zone
  why: 'Adult neurogenic niche lining the lateral ventricles whose route to the olfactory bulb largely shuts down by about 18 months in humans (KB physiology/neurogenesis.md; SOURCES_AND_CORRECTIONS: Sanai 2011, Bergmann 2012). Fact currently stored as a quantity on process:adult-neurogenesis.'
- wanted: structure:pedunculopontine-tegmental-nucleus
  label: Pedunculopontine tegmental nucleus (PPT)
  why: Pontine acetylcholine source in the ascending arousal system (R2 B11). Acetylcholine PRODUCED_IN and cholinergic CONTAINS_CELL currently point at structure:pons.
- wanted: structure:laterodorsal-tegmental-nucleus
  label: Laterodorsal tegmental nucleus (LDT)
  why: Pontine acetylcholine source in the ascending arousal system (R2 B11); same refinement as PPT.
- wanted: structure:dorsal-root-ganglion
  label: Dorsal root ganglion
  why: Home of pseudounipolar touch and body-position sensory neurons (KB cells/neuron_types.md; R1 §2 DCML). Sensory neuron containment currently points at structure:peripheral-nervous-system.
openQuestions:
- claim: Glutamate ACTS_ON kainate receptor.
  locator: R2 D2 Major receptor families
  reason: The sources list kainate receptors among the receptor families but never name their ligand. Textbook fact, but it would come from memory; needs a source line before asserting.
- claim: Inner hair cells (about 3,500) carry most of the auditory signal and outer hair cells (about 12,000) amplify it; semicircular canal hair cells start the vestibulo-ocular reflex.
  locator: R1 §8 Sensory systems end to end (Hearing); R2 B12 Vestibulo-ocular reflex
  reason: Hair cells are sensory receptor cells, not neurons, glia or progenitors, and vocab cellKind has no fitting term. Same gap for pericytes (KB anatomy/blood_brain_barrier.md), taste receptor cells (R1 §8) and capillary endothelial cells. Schema change needed (for example cellKind 'sensory_receptor' and 'vascular').
- claim: Rods and cones classified as cellKind neuron.
  locator: R1 §8 Sensory systems end to end (Vision)
  reason: Asserted by convention because the vocabulary forces a choice; the sources call them photoreceptors without classifying them. Reviewer should confirm.
- claim: Olfactory sensory neurons regenerate throughout life (asserted as PARTICIPATES_IN process:neurogenesis).
  locator: R1 §8 Sensory systems end to end (Smell); KB physiology/neurogenesis.md (Careful with)
  reason: 'Asserted, but flagged for review: the KB warns not to claim the human smell system is renewed by new neurons. That warning concerns the olfactory bulb route (shut down by about 18 months), not nasal sensory neurons; guide scripts must keep the two apart.'
- claim: Mirror neurons are found in ventral premotor cortex (monkey area F5); the human mirror neuron system is contested.
  locator: R1 §1.3 Premotor cortex (Function; Expert detail)
  reason: CONTAINS_CELL has no species qualifier; asserting region:3 contains mirror neurons would overstate the human evidence (Hickok 2009). Needs a modelling decision.
- claim: Large-scale S1 remapping after amputation (Pons et al. 1991; Ramachandran 1990s) versus a largely preserved hand map (Schone et al. 2025).
  locator: R1 §3 The homunculus (Phantom limbs and remapping)
  reason: A live plasticity debate, but it belongs with phenomenon:phantom-limb (functions agent). Not modelled here to avoid a duplicate debate; Ramachandran's work also lacks a year for a source id.
- claim: Cortical grey matter volume peaks at about age 6 (Bethlehem et al. 2022).
  locator: R1 §12 Lifespan development (Myelination)
  reason: Not a cell, molecule or process fact; belongs as a quantity on structure:grey-matter (anatomy agent).
- claim: Astrocytes supply fuel directly to neurons (extent debated).
  locator: KB cells/glia.md (Astrocytes)
  reason: Marked debated in the KB but no works are named on either side, so no CONTESTS pair can be sourced.
- claim: Adult humans grow new amygdala neurons.
  locator: KB SOURCES_AND_CORRECTIONS.md (Adult neurogenesis); KB physiology/neurogenesis.md (Careful with)
  reason: Corrected as unproven; no supporting source to anchor an asserts/disputes pair. Not modelled.
- claim: Hebb (1949) learning rule; cerebellar LTD (Ito); Betz cell counts (Lassek, 1940s).
  locator: KB physiology/synaptic_plasticity.md; R2 F Verification
  reason: Attributions lack a firm year or bibliographic detail, so no source ids were minted; the facts are cited to Kandel/Purves instead.
- claim: Receptor, channel, layer and circuit-transmitter facts from R2 Parts B, C and D cited to Kandel and Purves.
  locator: R2 B1 to B13; R2 C1 to C2; R2 D1 to D4
  reason: R2 gives no per-row attribution for these tables and describes them as textbook-consensus material, so the textbooks are cited. Reviewer should confirm against the textbooks before approval.
- claim: Neurogenesis evidence reported via Karolinska Institutet news (Dumitru et al. 2025).
  locator: KB physiology/neurogenesis.md (sources header)
  reason: Press release is a forbidden source; the underlying paper (source:dumitru-2025) is cited instead.
