- id: celltype:sensory-neuron
  class: CellType
  label: Sensory Neuron
  kind: neuron
  text:
    child: Neurons that notice touch, heat, light, sound and smells, then carry the news inward to your spinal cord and brain.
    curious: 'Sensory neurons respond when pressure, warmth, light or chemicals reach their endings, then relay the news inward. Their shapes differ: touch and body-position neurons have one process that splits in two, while vision, smell and hearing rely on bipolar neurons.'
  provenance:
