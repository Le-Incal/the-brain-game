    child: My ability to change with practice and to recover after injury. Playing this game is probably reshaping connections in your brain right now.
    curious: 'Neuroplasticity covers the ways the brain changes with experience or injury: synapses strengthening or weakening, neurons changing their excitability and circuits rewiring. It never switches off, although certain forms peak in childhood, and it is why rehabilitation after a stroke helps. Matching a word to the right region again and again is plasticity in action.'
