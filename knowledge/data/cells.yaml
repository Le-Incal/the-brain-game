- id: process:adult-neurogenesis
  class: Process
  label: Adult Neurogenesis
  kind: plasticity
  text:
    child: Whether grown-up brains make new neurons. Scientists think a few may appear in my hippocampus, but they are still arguing about it.
    curious: 'In rodents, new neurons are added throughout life in the hippocampus''s dentate gyrus and along a route to the olfactory bulb. In humans the evidence conflicts: some studies find immature neurons and dividing progenitors into old age, others find almost none in adults. The best summary is some, at low and variable levels, with an unknown role. The human route to the olfactory bulb shuts down by about 18 months.'
  quantities:
  - name: humanSvzToOlfactoryBulbRouteShutdownAge
    value: 18
    unit: months
    approx: true
    sources:
    - source:sanai-2011
    - source:bergmann-2012
    note: The subventricular zone to olfactory bulb route largely shuts down by about this age in humans; not a debated claim.
  - name: hippocampalNeuronsAddedPerDay
    value: 700
    unit: neurons/day
    approx: true
    sources:
    - source:spalding-2013
    note: Per hippocampus, from a single carbon-14 dating study. Human adult hippocampal neurogenesis is debated; voice only with that caveat.
  notes: Do not present adult neurogenesis in humans as either proven or ruled out. New neuron formation in the adult human amygdala has not been demonstrated. Attribute learning to plasticity rather than to newly made neurons.
  provenance:
