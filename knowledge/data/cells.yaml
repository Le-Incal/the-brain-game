- id: process:neurogenesis
  class: Process
  label: Neurogenesis
  kind: development
  pronunciation:
    respelling: NOOR-oh-JEN-eh-sis
  text:
    child: Making new neurons. Almost all of mine were made before you were born.
    curious: Neural stem cells split to produce progenitors, and these mature into glia or neurons that move to their places and join circuits. Averaged across all of pregnancy, that comes to about 250,000 new neurons every minute. The bulk of cortical neurons form during the first half of pregnancy. The standout exception is cerebellar granule cells, most of which appear during the first year after birth.
