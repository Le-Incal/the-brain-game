- id: celltype:motor-neuron
  class: CellType
  label: Motor Neuron
  kind: neuron
  aliases:
  - text: lower motor neuron
    kind: common
  text:
    child: Neurons that carry go signals from your spinal cord and brainstem out to your muscles.
    curious: Motor neurons in the spinal cord and brainstem send axons out to skeletal muscle, where acetylcholine makes the muscle contract. Upper motor neurons from the cortex command them. Damage to them causes weakness, wasting and lost reflexes. Smooth muscle, the heart and glands are run by autonomic neurons instead.
  notes: As the KB uses it day to day, this term means the lower motor neuron, running from brainstem and spinal cord out to skeletal muscle. Somatic motor neurons drive only skeletal muscle (QBI corrected on this point).
  provenance:
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: KB cells/neuron_types.md; KB anatomy/spinal_cord.md (Internal layout); KB physiology/neurotransmitters.md (Acetylcholine); R2 B9 Spinal reflex arcs; KB SOURCES_AND_CORRECTIONS.md (Types of neurons)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
