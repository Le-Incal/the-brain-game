- id: process:synaptic-transmission
  class: Process
  label: Synaptic Transmission
  kind: signalling
  text:
    child: 'How neurons pass on messages: the electric pulse makes the sending cell squirt chemicals across a tiny gap to the next cell.'
    curious: When a spike reaches an axon terminal, calcium channels open, vesicles fuse and transmitter spills into a cleft about 20 to 40 nanometres wide. Receptors on the next cell respond within about a millisecond, nudging it toward or away from firing. Some neurons instead connect electrically through gap junctions.
  quantities:
