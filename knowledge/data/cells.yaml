- id: celltype:oligodendrocyte
  class: CellType
  label: Oligodendrocyte
  kind: glia
  pronunciation:
    respelling: oh-lih-goh-DEN-droh-site
  text:
    child: Cells that wrap fatty insulation around my wires so messages race along. The fatty wrapping is what makes white matter pale.
    curious: Oligodendrocytes make myelin in the brain and spinal cord, and one cell can wrap segments of up to about 50 axons. Myelin lets impulses jump from gap to gap, which speeds them up and saves energy. In multiple sclerosis the immune system strips this myelin away.
  quantities:
