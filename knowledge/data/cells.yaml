  class: CellType
  label: Grid Cell
  kind: neuron
  text:
    child: Cells right next to my hippocampus that team up with place cells to help you find your way around.
    curious: Grid cells sit in the entorhinal cortex, beside the hippocampus. Together with hippocampal place cells they form the brain's navigation system. May-Britt and Edvard Moser's group described them in 2005.
