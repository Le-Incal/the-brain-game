- id: celltype:betz
  class: CellType
  label: Betz Cell
  kind: neuron
  pronunciation:
    respelling: BETS
  text:
    child: Giant cells in my movement strip. Their long wires reach down toward your spinal cord to help move your muscles.
    curious: Betz cells are giant pyramidal neurons in layer V of the primary motor cortex and rank among the biggest neurons anywhere in your nervous system. Despite their fame they supply only a small share of the fibres in the pathway to the spinal cord, roughly 3 to 5 percent.
  quantities:
  - name: cellCount
    value: 34000
    unit: cells
    approx: true
    sources:
    - source:kandel-pns
    note: Classic counts (Lassek); R2 F marks this as not re-verified.
  - name: shareOfCorticospinalAxons
    value: 4
    unit: percent
    approx: true
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    low: 3
    high: 5
    note: R1 gives about 3 to 5 percent; R2 F gives roughly 3 percent (about 34,000 Betz cells against about 1 million pyramidal tract axons). Value is the midpoint; not re-verified.
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    - source:qbi-brain-basics
    locator: R1 §1.5 Primary motor cortex (Key cells); R2 C1; R2 C2 Motor versus sensory cortex; R2 F Verification (Betz cell share); KB cells/neuron_types.md (Signature neurons)
