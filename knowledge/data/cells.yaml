- id: process:synaptic-pruning
  class: Process
  label: Synaptic Pruning
  kind: development
  text:
    child: Trimming away connections that are not needed, like pruning a bush so the strongest branches grow.
    curious: Young brains make more synapses than they keep. Synapse density peaks early in sensory areas, within the first year in visual cortex, and later in the prefrontal cortex; pruning then continues through adolescence. Microglia help remove the unneeded synapses.
