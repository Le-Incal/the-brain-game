- id: process:myelination
  class: Process
  label: Myelination
  kind: development
  text:
    child: Wrapping my wires in fatty insulation. It starts before birth, speeds up in your first two years and keeps going into your twenties.
    curious: Oligodendrocytes in the brain and Schwann cells in the nerves wrap axons in myelin, which speeds signals. It starts before birth, moves fastest in the first two years and is still going in a person's twenties; frontal and association pathways are the last to finish. White matter volume peaks at around age 29.
