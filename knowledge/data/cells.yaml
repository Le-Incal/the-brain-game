- id: celltype:place-cell
  class: CellType
  label: Place Cell
  kind: neuron
  text:
    child: Cells in my hippocampus that switch on when you are in one particular spot, like pins on a map in your head.
    curious: Each place cell in the hippocampus fires when an animal is in a particular location, so together they map a space. John O'Keefe reported them in 1971. With grid cells next door in the entorhinal cortex, they form a navigation system.
  provenance:
    sources:
    - source:okeefe-1971
    - source:kandel-pns
