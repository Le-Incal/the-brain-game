- id: celltype:astrocyte
  class: CellType
  label: Astrocyte
  kind: glia
  pronunciation:
    respelling: AS-troh-site
  text:
    child: Star-shaped helper cells that look after my neurons, tidy up around their connections and wrap my blood vessels.
    curious: 'Astrocytes clear away surplus neurotransmitter and potassium around synapses, store fuel, and wrap blood vessels with their end-feet, helping maintain the blood-brain barrier and matching blood flow to activity. Because they sit at so many synapses, scientists speak of a three-part synapse: two neurons plus an astrocyte.'
  notes: How much astrocytes feed neurons directly is still debated (KB cells/glia.md); not modelled as an assertion.
  provenance:
    sources:
    - source:qbi-brain-basics
    - source:brainfacts
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    - source:iliff-2012
    locator: KB cells/glia.md (Astrocytes); KB anatomy/blood_brain_barrier.md (Neurovascular unit); R1 §7 (Glymphatic system); R1 §13 (Blood-brain barrier); R1 §17c Glossary (Astrocyte)
