  kind: neuron
  text:
    child: Smell-detecting neurons inside your nose. New ones keep replacing old ones all through your life.
    curious: These cells live in the lining inside your nose. Each one makes just one kind of odour receptor from a repertoire of about 400, and its axon threads through the cribriform plate to reach the olfactory bulb. Unusually for neurons, they are replaced all through life. That renewal is distinct from the brain's internal supply route to the olfactory bulb, which closes down in infancy.
