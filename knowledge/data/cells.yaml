    child: A quick little spark of electricity zooming down a nerve cell. It either fires fully or not at all, just like a camera flash.
    curious: At rest a neuron sits near minus 70 millivolts. If its inputs push it to about minus 55, sodium channels open, sodium floods in and the inside briefly turns positive. Potassium channels then reset it, all within a millisecond or two. A stronger stimulus gives more spikes, not bigger ones.
    expert: Initiation typically occurs at the axon initial segment. Opening of voltage-gated sodium channels drives the membrane to a peak of roughly +30 to +40 mV; the sodium channels then inactivate while voltage-gated potassium channels restore the negative potential, and a short afterhyperpolarisation follows. The refractory period prevents the spike from propagating backwards. Hodgkin and Huxley's 1952 model, built on the squid giant axon, accounted for the underlying sodium and potassium currents. Thin unmyelinated fibres conduct at between roughly 0.5 and 2 m/s, while thick myelinated axons reach about 120 m/s.
  quantities:
  - name: restingPotential
    value: -70
    unit: mV
    approx: true
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    low: -80
    high: -60
    note: Typical; varies by cell type.
  - name: threshold
    value: -55
    unit: mV
    approx: true
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    low: -55
    high: -50
  - name: peakPotential
    value: 35
    unit: mV
    approx: true
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    low: 30
    high: 40
    note: Stated as +30 to +40 mV; value is the midpoint.
  - name: duration
    value: 1.5
    unit: ms
    approx: true
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    low: 1
    high: 2
    note: Stated as about 1 to 2 ms; value is the midpoint.
  - name: unmyelinatedConductionVelocity
    value: 1.25
    unit: m/s
    approx: true
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    low: 0.5
    high: 2
    note: Thin unmyelinated fibres; value is the midpoint of the stated range.
  provenance:
