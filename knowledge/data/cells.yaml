- id: process:long-term-potentiation
  class: Process
  label: Long-Term Potentiation
  kind: plasticity
  aliases:
  - text: LTP
    kind: abbreviation
  text:
    child: When you practise, connections between my neurons get stronger, so the message passes more easily next time.
    curious: Long-term potentiation is a lasting strengthening of a synapse after strong, well-timed activity, first shown in the rabbit hippocampus by Bliss and Lomo in 1973. In the classic form, NMDA receptors detect coincident activity, calcium pours in and extra AMPA receptors are added. It is the leading cellular model of learning, though not the whole story.
    expert: 'Classic NMDA-dependent LTP needs glutamate binding plus postsynaptic depolarisation to relieve the magnesium block; the resulting calcium influx activates CaMKII, which drives AMPA receptor insertion. The early phase lasts minutes to hours without any new protein being made; the late phase depends on switching on genes and building proteins through PKA and CREB, plus growth of dendritic spines. LTP is not the whole account of memory: shifts in how excitable neurons are, physical rewiring and engram cell assemblies also contribute.'
  provenance:
    sources:
    - source:qbi-brain-basics
    - source:brainfacts
    - source:kandel-pns
    - source:purves-neuroscience
    - source:bliss-lomo-1973
    locator: KB physiology/synaptic_plasticity.md; R2 B8 Hippocampal trisynaptic circuit; R2 D2 (NMDA)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: process:long-term-depression
