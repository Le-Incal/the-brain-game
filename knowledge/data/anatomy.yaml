- id: structure:hippocampus
  class: Structure
  label: Hippocampus
  kind: cortex_area
  visibility: hidden
  pronunciation:
    respelling: hip-oh-KAM-pus
  text:
    child: A curled, seahorse-shaped part deep in my temporal lobe. It saves new memories of what happens to you and helps you navigate.
    curious: Each temporal lobe has a hippocampus curled along its inner side. You rely on it to lay down fresh memories of facts and experiences, and its place cells, working with grid cells in the neighbouring entorhinal cortex, help you find your way. After surgeons removed both of his medial temporal lobes, patient H.M. lost the ability to store new facts and experiences, yet he could still pick up motor skills. Whether adults add new neurons here remains debated.
  provenance:
