- id: structure:central-nervous-system
  class: Structure
  label: Central Nervous System
  kind: system
  visibility: partly
  aliases:
  - text: CNS
    kind: abbreviation
  text:
    child: 'Me plus your spinal cord: the central hub where incoming signals are sorted and orders are sent out.'
    curious: Together, the brain and spinal cord form the central nervous system. Sensory signals flow in, get interpreted, and turn into commands for muscles and glands. Simple reflexes, like jerking a hand off a hot pan, can be handled by the cord alone. All other nerves make up the peripheral nervous system.
  provenance:
