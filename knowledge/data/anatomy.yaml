  label: Blood-Brain Barrier
  kind: tissue
  visibility: hidden
  diffuse: true
  aliases:
  - text: BBB
    kind: abbreviation
  - text: hemato-encephalic barrier
    kind: historical
  text:
    child: The tightly sealed lining of my tiny blood vessels. It lets oxygen and fuel through while blocking many germs and chemicals.
    curious: Brain capillaries are lined with cells stitched together by tight junctions and wrapped by pericytes and astrocyte end-feet. Oxygen and small fat-soluble molecules slip across, glucose rides on carrier proteins, and most other substances stay out, which is a major hurdle for brain medicines.
