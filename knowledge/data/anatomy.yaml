    child: Deep clusters that act like a gate, letting the chosen movement or habit through and holding back the rest.
    curious: 'The basal ganglia are deep nuclei: the caudate and putamen (together the striatum), the globus pallidus, the subthalamic nucleus and the substantia nigra. A ''go'' pathway and a ''no-go'' pathway, tuned by dopamine, help select one action while holding back the rest. Losing their dopamine input causes Parkinson''s disease.'
