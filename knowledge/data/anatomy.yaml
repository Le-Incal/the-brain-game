- claim: NeuroNames ID for region 1 (prefrontal cortex) is 1072
  locator: R2 E1 row 1
  reason: R2 reports a conflict with Wikidata (2429). Kept 1072 as an unverified xref from the Uberon cross-reference; needs a NeuroNames lookup.
- claim: NeuroNames ID 1233 for Wernicke's area (region 13)
  locator: R2 E1 row 13
  reason: Value rests only on Wikipedia (forbidden source). Held back.
- claim: NeuroNames ID 643 for the cerebellum (region 19)
  locator: R2 E1 row 19
  reason: Value rests only on Wikidata, used there as a source rather than as an xref. Held back pending a NeuroNames lookup.
- claim: Pointer anchors for basal ganglia (region 12), lateral ventricles (region 16), third and fourth ventricles (region 20)
  locator: R1 §5; R1 §7; KB anatomy/forebrain.md
  reason: Sources describe these hidden structures but never name the painted region above them. The anchors and hints were chosen by the extractor to satisfy the pointer rule (confidence approximate) and need steward review.
- claim: Mammillary bodies, septal nuclei and parahippocampal gyrus point only via the limbic system (region 16)
  locator: KB anatomy/limbic_system.md
  reason: Sources give membership but no location; the resulting pointer is coarse.
- claim: 'Region 8 crosswalk: superior parietal UBERON 0006094 and DK superiorparietal are ''equivalent'''
  locator: R2 E1 row 8
  reason: Canon region 8 covers the superior parietal lobule plus the supramarginal gyrus, so these xrefs were recorded as narrower, not close.
- claim: Region 14 crosswalk row describes the fusiform gyrus
  locator: R2 E1 row 14
  reason: Canon region 14 is Inferior Temporal Cortex. Fusiform IDs were recorded as close on structure:fusiform-gyrus and narrower on region:14.
- claim: Region 20 is the pons and medulla only; the midbrain is unpainted
  locator: KB anatomy/midbrain.md (On the model); KB anatomy/hindbrain.md (On the model); KB anatomy/lobes.md (region 14 'Fusiform', region 15 unresolved)
  reason: KB text predates canon. Canon region 20 is the whole brain stem and region 15 is the piriform cortex; extraction follows canon. The KB 'On the model' notes need updating.
- claim: Brodmann 51 for the piriform cortex (region 15)
  locator: R2 E1 row 15-alt
  reason: R2 calls this a broad numbering and a poor fit for allocortex; recorded as related rather than close.
- claim: Frontal eye field location
  locator: R1 §1.3; R2 B1
  reason: R1 says it sits near premotor cortex around BA 8; R2 places it within regions 1 and 3. Two approximate PART_OF edges were recorded.
- claim: Cranial root of the accessory nerve (CN XI)
  locator: R1 §6 Cranial nerves (row XI)
  reason: R1 marks the cranial root as debated; no structure or assertion was created for it.
