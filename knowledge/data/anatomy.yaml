  kind: nuclear_group
  visibility: hidden
  pronunciation:
    respelling: uh-MIG-duh-luh
  text:
    child: A small almond-shaped cell group in my temporal lobe. It reacts fast to threats and to anything that matters to you.
    curious: Sitting just ahead of the hippocampus, the amygdala is a group of nuclei that spots threats and other significant events, helps you learn what to fear, colours memories with emotion and picks up social signals like where someone is looking. Because it also reacts to rewards and new things, calling it a fear centre undersells it.
