    kind: historical
  - text: lateral sulcus
    kind: common
  text:
    child: A long, deep crease on each side of me, with my temporal lobe below it. My insula and hearing ridges hide inside.
    curious: The lateral fissure separates the temporal lobe below from the frontal and parietal lobes above. It is usually continuous and is the first major groove to appear before birth. The insula and Heschl's gyri lie hidden in its depths. Its other name, the Sylvian fissure, honours Franciscus Sylvius.
