requests:
- wanted: structure:temporoparietal-junction
  label: Temporoparietal junction
  why: 'R1 §9: right TPJ is a ventral attention network member (MEMBER_OF network:ventral-attention, role node, confidence approximate; sources corbetta-shulman-2002). Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:anterior-insula
  label: Anterior insula
  why: R1 §9 names the anterior insula (not the whole insula) as the salience core; hub edge placed on registry structure:insula per instructions and could be retargeted. Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.
- wanted: structure:ventral-frontal-cortex
  label: Ventral frontal cortex
  why: 'R1 §9: ventral attention network member (VFC). No registry id; closest anatomy.yaml id is structure:ventrolateral-prefrontal-cortex, but the sources do not equate them.'
- wanted: structure:septal-nuclei
  label: Septal nuclei
  why: 'R2 A9: fornix termination (CONNECTS tract:fornix, endpoint termination). Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:thalamic-reticular-nucleus
  label: Thalamic reticular nucleus
  why: 'R2 B3: GABAergic gate in the thalamocortical loop (INCLUDES). Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:dentate-gyrus
  label: Dentate gyrus
  why: 'R2 B8: trisynaptic circuit step 2 (perforant path target). Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:ca3
  label: CA3
  why: 'R2 B8: trisynaptic circuit step 3 (mossy fibre target). Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:ca1
  label: CA1
  why: 'R2 B8: trisynaptic circuit step 4 (Schaffer collateral target). Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:subiculum
  label: Subiculum
  why: 'R2 B8: trisynaptic circuit output step 5.'
- wanted: structure:ventral-pallidum
  label: Ventral pallidum
  why: 'R2 B1: anterior cingulate (limbic) basal ganglia loop, between nucleus accumbens and MD thalamus.'
- wanted: structure:basal-forebrain
  label: Basal forebrain
  why: 'R2 B11: acetylcholine source in the ascending arousal system.'
- wanted: structure:pre-botzinger-complex
  label: Pre-Bötzinger complex
  why: 'R2 B10: breathing rhythm generator; currently represented by structure:medulla-oblongata. Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:inferior-olivary-nucleus
  label: Inferior olivary nucleus
  why: R2 A15 inferior cerebellar peduncle input and R2 B2 climbing fibres. Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.
- wanted: structure:abducens-nucleus
  label: Abducens nucleus
  why: 'R2 B12: VOR target in the pons; currently represented by structure:pons. Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:oculomotor-nucleus
  label: Oculomotor nucleus
  why: 'R2 B12: VOR target in the midbrain; currently represented by structure:midbrain. Not in the shared registry; anatomy.yaml already defines this id, so the edge can be added once it is confirmed.'
- wanted: structure:adrenal-gland
  label: Adrenal gland
  why: 'R2 B13: HPA axis step 3 (adrenal cortex releases cortisol); outside the modelled brain, visibility not_present.'
- wanted: function:cognitive-control
  label: Cognitive control
  why: 'R1 §9: central executive network supports ''flexible control and rule use''; no registry Function for SUBSERVES.'
- wanted: function:future-thinking
  label: Imagining the future
  why: 'R1 §9: DMN is active when imagining the future; no registry Function for SUBSERVES.'
- wanted: function:salience-detection
  label: Salience detection
  why: 'R1 §9: salience network detects what matters and switches between DMN and executive networks; no registry Function for SUBSERVES.'
openQuestions:
- claim: The salience network and the ventral attention network are one network (network:ventral-attention).
  locator: R1 §9 Brain networks
  reason: R1 §9 describes them separately with different members and authors (Seeley 2007 vs Corbetta and Shulman 2002); the registry aliases them following the Yeo-7 'Ventral Attention (Salience)' label. Members of both were attached to network:ventral-attention. Reviewer should confirm the merge is acceptable for teaching.
- claim: DMN member 'lateral temporal cortex'.
  locator: R1 §9 Brain networks
  reason: No single canon region or registry structure; not mapped. R2 E4 rows 12 and 13 already give temporal default-mode edges.
- claim: Ventral striatum equals nucleus accumbens.
  locator: R1 §9; R2 E4 (Choi et al. 2012); KB anatomy/limbic_system.md
  reason: Ventral striatum edges (salience member, limbic network) placed on structure:nucleus-accumbens because the KB equates them; confirm.
- claim: 'R2 E4 row 16 networks apply to cingulate subdivisions (dorsal: ventral attention; PCC: default; subgenual: limbic).'
  locator: R2 E4 row 16
  reason: Edges placed on region:16 as a whole per instructions; subdivision detail survives only via structure:posterior-cingulate-cortex (default hub) and structure:anterior-cingulate-cortex (salience hub). Same for row 4 (pre-SMA) and row 11 (auditory) qualifiers.
- claim: Region 15 Yeo network membership.
  locator: R2 E4 row 15
  reason: Row 15 describes the midbrain (outside cortical parcellation); no row covers piriform cortex, which is canon region 15. No edges created for 15 or 20.
- claim: Yeo-17 label TempPar belongs to a particular Yeo-7 network.
  locator: R2 E4 Yeo 7 and 17 networks
  reason: Listed among the 17 labels and in row 13 but not assigned to a 7-network in the source; not added as an xref. Other yeo17 xrefs were assigned by label prefix (matchType narrower, unverified).
- claim: Broca's area partly belongs to the multiple demand network; motor cortex hosts a somato-cognitive action network (SCAN) linked to a cingulo-opercular action network.
  locator: R1 §1.6 Broca's area; R1 §3 The homunculus
  reason: Not registry networks, so no nodes or MEMBER_OF edges were created. SCAN is also flagged as a recent, contested proposal.
- claim: 'Pathways and bundles named in the sources but absent from the tract registry: mammillothalamic tract, medial longitudinal fasciculus, auditory radiation, optic nerve and optic tract, lateral olfactory tract, extreme capsule fasciculus, perforant path, mossy fibres, Schaffer collaterals, frontopontine and corticobulbar fibres.'
  locator: R1 §2; R1 §8; R2 A6, A12, B4, B8, B12
  reason: Not created. R1 §2 visual and auditory pathways have no registry tract or circuit, so only the optic radiation (visual) is captured and the auditory pathway is not modelled.
- claim: Attribution of uncited tract endpoints and circuit flows.
  locator: R2 Part A; R2 Part B
  reason: Most A and B entries carry no inline citation. Uncited tract facts were attributed to Catani and Thiebaut de Schotten 2012 (named in R2 Part A Methods as the main human reference) plus R1/KB textbooks where those sections cover the tract; uncited circuit flows (B2, B3, B5 to B7, B8, B9, B11 to B13) were attributed to Kandel/Purves/Blumenfeld as textbook consensus, as R2's preamble says. Reviewer should confirm.
- claim: Tract kind for fornix, cerebellar peduncles, medial forebrain bundle, DCML and spinothalamic tract.
  locator: R2 A9, A15, A16; R1 §2
  reason: Sources do not classify these; set to projection by the schema's definitions (links to subcortical, brain stem or spinal targets). The fornix in particular is classified differently across texts.
- claim: Origin and termination labels on bidirectional association and commissural tracts.
  locator: R2 A1 to A11, A17
  reason: 'Sources list endpoints without direction. Convention used: posterior end origin, anterior end termination, waypoints via; commissural endpoints termination. Recorded in each tract''s notes.'
- claim: Corpus callosum has about 200 million axons.
  locator: R1 §5; R2 F; KB anatomy/corpus_callosum.md
  reason: R1 cites Tomasch 1954 (about 200 million); R2 F cites Aboitiz et al. 1992 (about 200 million, up to 250 million; not re-verified); KB gives 200 to 300 million with 200 to 250 million most cited. Stored as about 200 million, range 200 to 300 million.
- claim: About 85 to 90 percent of corticospinal fibres cross at the pyramidal decussation.
  locator: R1 §2; R2 F Verification
  reason: R2 F says this was not re-verified and that textbooks range about 75 to 90 percent; stored as 85 to 90 percent per both reports' recommended wording.
- claim: The angular gyrus is a hub.
  locator: R1 §1.9 Angular gyrus (Seghier 2013)
  reason: Called a cross-modal integrative hub, not a hub of a named network; kept role node in the default-mode network.
- claim: Fast 'low road' from sensory thalamus to amygdala.
  locator: R2 B5
  reason: Debated for primates (Pessoa and Adolphs 2010). The thalamus INCLUDES edge was kept because the thalamus also feeds the high road; the debate is recorded in the circuit notes.
- claim: Every tractography picture is a model (many false-positive bundles).
  locator: R2 Part A Methods (Maier-Hein et al. 2017); R1 §11
  reason: R2 asks that this limitation be stated whenever tracts are shown. It is a UI or script rule rather than a graph fact, so it was not encoded.
- claim: Unnumbered tract endpoints.
  locator: R2 A8, A10
  reason: MdLF 'occipital cortex' and the splenium's 'parts of the temporal lobe' have no region numbers in the source; omitted rather than guessed.
- claim: region:19 MEMBER_OF network:visual
  locator: R2 E4 row 19
  reason: R2 says all 7 Yeo networks are represented in the cerebellum (Buckner 2011), but Buckner 2011 itself reports that primary visual cortex is not represented there. Held back until checked.
