    status: proposed
- id: circuit:nigrostriatal-pathway
  class: Circuit
  label: Nigrostriatal Pathway
  summary: Dopamine neurons of the substantia nigra pars compacta project to the dorsal striatum, supporting movement start-up, vigour and habits.
  text:
    child: A dopamine supply line from my midbrain to my movement nuclei. When it fades, moving becomes slow and stiff, as in Parkinson's disease.
    curious: Cells in the compact part of the substantia nigra release dopamine onto D1 and D2 receptors in the dorsal striatum, helping movements start and stay vigorous and habitual. In Parkinson's disease, motor signs appear only after a large share of these neurons is lost, and drugs that block D2 receptors can cause similar signs.
  provenance:
