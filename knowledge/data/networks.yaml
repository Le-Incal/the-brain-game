    status: proposed
- id: circuit:spinal-reflex-arc
  class: Circuit
  label: Spinal Reflex Arc
  summary: Short circuits inside the spinal cord that turn a sensory input straight into a muscle response, such as the knee jerk or pulling away from pain, tuned from above by motor cortex and brain stem.
  text:
    child: A shortcut in your spinal cord that pulls your hand off something hot before I even hear about it.
    curious: In the knee jerk, a stretch sensor's fibre makes a single synapse onto a motor neuron that contracts the same muscle, while an inhibitory interneuron relaxes the opposing muscle. Withdrawal reflexes use interneurons to bend the hurt limb and straighten the other leg so you stay standing. Motor cortex and brain stem tune reflexes from above.
  provenance:
    sources:
    - source:kandel-pns
    locator: R2 B9 Spinal reflex arcs
