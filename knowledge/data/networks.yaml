    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: circuit:papez
  class: Circuit
  label: Papez Circuit
  summary: A memory loop from the hippocampus through the fornix, mammillary bodies, anterior thalamus and cingulate cortex and back via the parahippocampal region, first proposed in 1937 as a circuit for emotion.
  text:
    child: A ring of memory parts deep inside me, linking my hippocampus to my cingulate belt and back again.
    curious: From the hippocampus, signals pass along the fornix to the mammillary bodies, then to the front of the thalamus and the cingulate cortex, and return through the cingulum to the parahippocampal and entorhinal cortex. Proposed in 1937 for emotion, it is now seen mainly as a system for memories of events. Damage to its parts, as in Korsakoff syndrome, impairs memory.
  notes: The mammillothalamic tract (mammillary bodies to anterior thalamus) is not a registry tract, so the sequence jumps from order 3 to the thalamus at order 4. Emotion is now thought to depend more on the amygdala, orbitofrontal and ventromedial prefrontal cortex.
  provenance:
    sources:
    - source:papez-1937
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: R2 B4 Papez circuit (1937) and modern view; KB anatomy/limbic_system.md (Papez circuit)
