- id: tract:medial-forebrain-bundle
  class: Tract
  label: Medial Forebrain Bundle
  kind: projection
  aliases:
  - text: MFB
    kind: abbreviation
  text:
    child: A bundle carrying the brain's reward chemicals from my midbrain up to the front of me.
    curious: 'It runs from the ventral tegmental area of the midbrain and the lateral hypothalamus to the nucleus accumbens and the orbitofrontal and prefrontal cortex, carrying dopamine, noradrenaline and serotonin fibres. It is tied to reward and motivation: in 1954, rats pressed a lever again and again to stimulate this region.'
  notes: Deep brain stimulation of the MFB for depression is experimental (informational only).
  provenance:
