- id: tract:corticospinal-tract
  class: Tract
  label: Corticospinal Tract
  kind: projection
  aliases:
  - text: pyramidal tract
    kind: common
  pronunciation:
    respelling: KOR-tih-koh-SPY-nul tract
  text:
    child: The long motor highway from my movement strip down to your spinal cord. Most of its fibres swap sides low in my brain stem.
    curious: It starts mainly in primary motor cortex, joined by fibres from premotor, supplementary motor and touch cortex. It descends through the corona radiata, the internal capsule, the cerebral peduncle of the midbrain, the pons and the pyramids of the medulla. Low in the medulla most fibres cross to the other side, which is why each hemisphere moves the opposite side of the body.
  quantities:
  - name: axonCountPerPyramid
    value: 1000000
    unit: axons
    approx: true
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:blumenfeld-neuroanatomy
    - source:nolte-human-brain
  - name: fractionCrossingAtPyramidalDecussation
    value: 85
    unit: percent
    approx: true
    low: 85
    high: 90
    sources:
    - source:purves-neuroscience
    - source:nolte-human-brain
    note: Most fibres, about 85 to 90 percent, form the lateral corticospinal tract; the rest descend uncrossed in the anterior corticospinal tract. Textbook figures range about 75 to 90 percent.
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:blumenfeld-neuroanatomy
    - source:nolte-human-brain
    locator: R2 A13 Corticospinal tract; R1 §2 Pathways and body control (Corticospinal tract); R1 §1.20 Brainstem
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:optic-radiation
  class: Tract
  label: Optic Radiation
  kind: projection
  aliases:
  - text: optic radiations
    kind: common
  text:
    child: A wide fan of wires taking what your eyes see from my deep relay station to my vision area at the back.
    curious: It runs from the lateral geniculate nucleus of the thalamus to primary visual cortex. Fibres for the upper part of your view swing forward through the temporal lobe in Meyer's loop, while parietal fibres carry the lower part. Damage to Meyer's loop removes a wedge of the upper view on the opposite side, nicknamed 'pie in the sky'.
  notes: Meyer's loop (MY-erz) is the forward-looping upper-field part; tractography is used before temporal lobe surgery to spare it.
  provenance:
