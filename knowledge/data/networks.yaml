- id: circuit:trisynaptic-circuit
  class: Circuit
  label: Hippocampal Trisynaptic Circuit
  summary: A three-synapse chain from entorhinal cortex to dentate gyrus to CA3 to CA1, with output through the subiculum back to entorhinal cortex, that supports memory for events and places.
  text:
    child: A chain of three linked hand-offs inside my hippocampus, where new memories of places and events take shape.
    curious: The loop starts when entorhinal cortex projects via the perforant path onto granule cells of the dentate gyrus. Mossy fibres then relay the message to CA3, whose cells also excite one another. Schaffer collaterals hand it on to CA1, and CA1 returns output to entorhinal cortex by way of the subiculum. Long-term potentiation was first reported at perforant path synapses in 1973. This is where Alzheimer's changes first appear.
  notes: Because the registry lacks dentate gyrus, CA3, CA1 and subiculum, the chain is collapsed into structure:hippocampus at order 2 (see requests). Entorhinal layer III also projects directly to CA1. Pattern separation in the dentate and pattern completion in CA3 are computational models.
  provenance:
    sources:
    - source:kandel-pns
    - source:bliss-lomo-1973
    locator: R2 B8 Hippocampal trisynaptic circuit
    license: own
    method: ai_extracted
