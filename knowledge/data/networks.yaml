- id: tract:internal-capsule
  class: Tract
  label: Internal Capsule
  kind: projection
  text:
    child: A tight, bent pass deep inside each half of me where wires heading to and from your body crowd together.
    curious: Its front limb carries fibres between the thalamus and prefrontal cortex and from frontal cortex to the pons; its bend carries face-movement fibres from motor cortex to cranial nerve nuclei in the brain stem; its back limb carries corticospinal fibres and touch fibres from the thalamus to sensory cortex. Because fibres pack so tightly here, a tiny stroke can weaken a whole side of the body.
  notes: Endpoints are those of the fibre systems that pass through each limb.
  provenance:
    sources:
    - source:catani-2012-b
    - source:kandel-pns
    - source:purves-neuroscience
    - source:blumenfeld-neuroanatomy
    - source:nolte-human-brain
    locator: R2 A12 Internal capsule and corona radiata; R1 §2 Pathways and body control (Corticospinal tract)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:corona-radiata
  class: Tract
  label: Corona Radiata
  kind: projection
  pronunciation:
    respelling: kuh-ROH-nuh ray-dee-AH-tuh
  text:
    child: Fans of fibres spreading out between my deep pass and my folded surface, shaped like the rays of a crown.
    curious: Above the internal capsule, projection fibres spread out in a fan to and from the cortex. Movement fibres from primary motor, premotor, supplementary motor and touch cortex pass through it on their way down to the brain stem and spinal cord.
  provenance:
    sources:
