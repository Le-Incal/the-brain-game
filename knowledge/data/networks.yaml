- id: network:limbic
  class: Network
  label: Limbic Network
  atlas: yeo7
  yeoLabel: Limbic
  text:
    child: A group of areas on my underside, centred on the patch above your eyes, whose activity rises and falls together.
    curious: One of seven large networks found by comparing resting brain scans from 1,000 people. Its main cortical member is the orbitofrontal cortex above the eye sockets, with parts of the cingulate below the corpus callosum and the underside of the temporal lobe listed as secondary members.
  xrefs:
  - scheme: yeo17
    value: LimbicA
    matchType: narrower
    verified: false
