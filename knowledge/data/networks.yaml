- id: circuit:vestibulo-ocular-reflex
  class: Circuit
  label: Vestibulo-Ocular Reflex
  summary: A reflex that carries head-turn signals from the inner ear's semicircular canals through the vestibular nuclei to the eye-movement nuclei, turning the eyes opposite to the head, with the cerebellar flocculus tuning its strength.
  aliases:
  - text: VOR
    kind: abbreviation
  text:
    child: A reflex that keeps your view steady by moving your eyes the opposite way whenever your head turns.
    curious: Hair cells in the semicircular canals signal head turns through the vestibular nerve to the vestibular nuclei. Crossed fibres in the medial longitudinal fasciculus reach the abducens nucleus in the pons and the oculomotor nucleus in the midbrain, so the eyes counter-rotate. The cerebellar flocculus adjusts the strength. Doctors test it in coma examinations.
  notes: The medial longitudinal fasciculus is not a registry tract; abducens and oculomotor nuclei are represented by structure:pons and structure:midbrain (see requests).
  provenance:
    sources:
    - source:kandel-pns
    - source:blumenfeld-neuroanatomy
