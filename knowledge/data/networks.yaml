    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: circuit:thalamocortical-loop
  class: Circuit
  label: Thalamocortical Loop
  summary: Thalamic relay nuclei send sensory and motor signals to matching cortical areas, which send feedback to the same nuclei, while the thalamic reticular nucleus gates which channels get through.
  text:
    child: Back-and-forth chatter between my central relay station and my surface, deciding which messages get through.
    curious: 'Each relay nucleus feeds one cortical area: vision to primary visual cortex, hearing to auditory cortex, body touch to somatosensory cortex and motor signals to motor cortex. Deep cortical layers answer back. A thin inhibitory shell around the thalamus acts as a gate, which may help with attention and sleep rhythms. Absence seizures involve this loop.'
  notes: Relay input lands mainly in layer IV; layer VI sends feedback. The 'searchlight' idea for attention (Crick 1984) is still a hypothesis.
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:crick-1984
    locator: R2 B3 Thalamocortical loops and thalamic reticular nucleus; R1 §5 Hidden and deep structures (Thalamus)
