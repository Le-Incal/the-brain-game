    assertedOn: 2026-10-02
    status: proposed
- id: circuit:amygdala-fear-circuit
  class: Circuit
  label: Amygdala Fear Circuit
  summary: A threat-response circuit in which sensory signals reach the amygdala directly from the thalamus or by way of sensory cortex, and the amygdala's central nucleus drives hormonal, freezing and heart-rate responses while prefrontal cortex and hippocampus adjust it.
  text:
    child: My danger-detector setup. A quick rough route and a slower careful route both tell my amygdala about possible threats.
    curious: In rat studies, a fast 'low road' runs from the sensory thalamus straight to the amygdala, and a slower 'high road' passes through sensory cortex first. The amygdala then drives the hypothalamus, the periaqueductal grey and brain stem nuclei. Ventromedial prefrontal cortex and the hippocampus help decide when the danger is over. Whether primates need the low road is debated.
  notes: 'Debated: a fast subcortical visual route may not be needed in primates (Pessoa and Adolphs 2010). Defensive survival circuits are distinct from the conscious feeling of fear, and the ''fear centre'' label is rejected (LeDoux and Pine 2016). Model derived from rat fear conditioning.'
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:pessoa-adolphs-2010
    - source:ledoux-pine-2016
    locator: R2 B5 Amygdala fear circuit (LeDoux low road and high road); R1 §5 Hidden and deep structures (Amygdala)
