- id: tract:u-fibers
  class: Tract
  label: U-Fibres
  kind: association
  aliases:
  - text: U-fibers
    kind: common
  - text: short association fibres
    kind: common
  text:
    child: Short hooked fibres hugging the underside of my folds, so each patch of my surface can talk to its neighbour.
    curious: These short association fibres sit just beneath the cortex and join neighbouring gyri, for example the motor strip with the touch strip, or primary visual cortex with the visual areas around it. They are hard to image because they hug the cortex so closely.
  notes: 'Endpoint convention: bidirectional bundle; the source lists endpoints without direction, so the posterior end is recorded as origin, the anterior end as termination and waypoints as via. Endpoints are the source''s examples, not an exhaustive list.'
