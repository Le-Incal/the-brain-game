- id: circuit:hpa-axis
  class: Circuit
  label: HPA Axis
  summary: 'A relay of hormones: CRH and vasopressin from the hypothalamus, then ACTH from the anterior pituitary, then cortisol from the adrenal cortex. Cortisol loops back to quiet the whole system.'
  aliases:
  - text: HPA stress axis
    kind: common
  - text: hypothalamic-pituitary-adrenal axis
    kind: common
  text:
    child: My stress-hormone chain. My hypothalamus nudges the gland just below me, which signals your adrenal glands to release cortisol.
    curious: When stress hits, the hypothalamus sends out CRH and vasopressin from its paraventricular nucleus; then the anterior pituitary secretes ACTH, and the adrenal cortex in turn produces cortisol. Cortisol acts back on the pituitary, hypothalamus, prefrontal cortex and hippocampus. The amygdala drives the axis harder, whereas the medial prefrontal cortex and hippocampus rein it in.
  notes: The adrenal cortex (order 3) is outside the modelled brain and not a registry structure (see requests).
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    locator: R2 B13 HPA stress axis; R1 §5 Hidden and deep structures (Hypothalamus; Pituitary gland)
    license: own
