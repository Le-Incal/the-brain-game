  class: Tract
  label: Spinothalamic Tract
  kind: projection
  pronunciation:
    respelling: SPY-noh-thuh-LAM-ik tract
  text:
    child: The pathway for pain, heat and cold, which crosses to the other side almost as soon as it enters your spinal cord.
