- id: network:dorsal-attention
  class: Network
  label: Dorsal Attention Network
  atlas: yeo7
  yeoLabel: Dorsal Attention
  text:
    child: A team near the top of me that aims your attention wherever you choose, like a torch you point on purpose.
    curious: On both sides, the superior parietal lobule, the intraparietal sulcus and the frontal eye fields work together when you deliberately decide where to look or what to attend to. This is goal-driven, top-down attention, as opposed to having your attention grabbed by a surprise.
  xrefs:
