# Brain Game knowledge base: networks. Extracted 2026-10-02; every record is proposed until the steward approves it.
nodes:
- id: network:default-mode
  class: Network
  label: Default Mode Network
  atlas: yeo7
  yeoLabel: Default
  aliases:
  - text: DMN
    kind: abbreviation
  text:
    child: A team of my areas that gets busy when you daydream, remember your past or wonder what someone else is thinking.
    curious: 'When you stop focusing on the world outside, a set of my areas becomes more active together: the precuneus and posterior cingulate along my midline, the medial prefrontal cortex, the angular gyrus and the hippocampal region. This team is linked to mind-wandering, recalling your own past, imagining what comes next and thinking about other people.'
    expert: 'The hubs are the posterior cingulate and the precuneus; other core nodes include medial prefrontal cortex, lateral temporal cortex, the angular gyrus with the inferior parietal lobule, and the hippocampal formation. History: reliable deactivations during tasks were described in 1997, the name followed in 2001, and resting-state functional connectivity within it was demonstrated in 2003. Its borders vary with the parcellation chosen (Yeo 7- or 17-network, Gordon), and precision mapping shows they also shift from one person to another.'
  xrefs:
  - scheme: yeo17
    value: DefaultA
    matchType: narrower
    verified: false
  - scheme: yeo17
    value: DefaultB
    matchType: narrower
    verified: false
  - scheme: yeo17
    value: DefaultC
    matchType: narrower
    verified: false
  notes: Network boundaries vary with atlas and between individuals; all memberships are approximate.
  provenance:
    sources:
    - source:yeo-2011
    - source:raichle-2001
    - source:shulman-1997
    - source:greicius-2003
    - source:buckner-2008
    locator: R1 §9 Brain networks; R2 E4 Yeo 7 and 17 networks
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: network:ventral-attention
  class: Network
  label: Ventral Attention Network
  atlas: yeo7
  yeoLabel: Ventral Attention
  aliases:
  - text: salience network
    kind: common
  - text: ventral attention (salience) network
    kind: common
  text:
    child: My alarm-and-spotlight team. It notices when something important or surprising happens and swings your attention towards it.
    curious: This network flags what matters. Its salience core, the anterior insula and the dorsal anterior cingulate, helps switch the brain between inward thought and focused work. Its ventral attention part, mostly on the right side, pulls your attention to something unexpected, like a sudden noise. Damage to that right-sided part is linked to ignoring one side of space.
  xrefs:
  - scheme: yeo17
    value: SalVentAttnA
    matchType: narrower
    verified: false
  - scheme: yeo17
    value: SalVentAttnB
    matchType: narrower
    verified: false
  notes: The registry folds together two networks that R1 §9 treats as distinct. One is the salience network (anterior insula, dorsal ACC, with amygdala and ventral striatum); the other is the right-lateralized ventral attention network (right TPJ, ventral frontal cortex). In Yeo-7 the combined label is Ventral Attention (Salience).
  provenance:
    sources:
    - source:yeo-2011
    - source:seeley-2007
    - source:menon-uddin-2010
    - source:corbetta-shulman-2002
    locator: R1 §9 Brain networks; R2 E4 Yeo 7 and 17 networks
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: network:frontoparietal-control
  class: Network
  label: Frontoparietal Control Network
  atlas: yeo7
  yeoLabel: Frontoparietal Control
  aliases:
  - text: central executive network
    kind: common
  - text: frontoparietal network
    kind: common
  text:
    child: My planning team. Areas at my front and near my top work together to hold things in mind and follow the rules of a task.
    curious: The dorsolateral prefrontal cortex and the cortex around the intraparietal sulcus form a partnership that keeps information active for a few seconds, applies rules and changes strategy when a task changes. It is also called the central executive network.
