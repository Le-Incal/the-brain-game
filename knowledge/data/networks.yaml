- id: network:language
  class: Network
  label: Language Network
  atlas: fedorenko
  text:
    child: A team of my frontal and temporal areas, mostly on the left, that works on words and sentences and stays quiet for maths or music.
    curious: Frontal areas (the inferior and middle frontal gyri) and temporal areas (the superior and middle temporal gyri and the front of the temporal lobe), mostly on the left, respond to language and hardly at all to arithmetic, music or logic puzzles. Researchers locate it person by person with a short language test, because its exact position differs between people.
  notes: Lateralized to the left. Mapped person by person using functional localizers. A 2024 position paper made the case that language serves mainly communication, not thought; this claim is contested.
  provenance:
    sources:
    - source:fedorenko-2010
    - source:fedorenko-2011
    locator: R1 §9 Brain networks (Language network)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:arcuate-fasciculus
  class: Tract
  label: Arcuate Fasciculus
  kind: association
  pronunciation:
    respelling: AR-kyoo-ate fuh-SIK-yoo-lus
  text:
    child: A bow-shaped bundle of wires linking the parts of me that make sense of words with the part that says them.
    curious: This arched bundle runs from Wernicke's area and the superior temporal gyrus, past the angular gyrus, to Broca's area and premotor cortex. One model splits it into a long direct segment and two shorter segments that stop off in the inferior parietal lobule. Damage is classically linked to trouble repeating words, called conduction aphasia.
  notes: 'Endpoint convention: bidirectional bundle; the source lists endpoints without direction, so the posterior end is recorded as origin, the anterior end as termination and waypoints as via. Three-segment model (Catani 2005): long direct segment, anterior and posterior indirect segments via the inferior parietal lobule.'
  provenance:
    sources:
    - source:catani-2005
    locator: R2 A1 Arcuate fasciculus; R1 §17c Glossary (Arcuate fasciculus)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:superior-longitudinal-fasciculus
  class: Tract
  label: Superior Longitudinal Fasciculus
  kind: association
  aliases:
  - text: SLF
    kind: abbreviation
  pronunciation:
    respelling: soo-PEER-ee-er lon-jih-TOO-dih-nul fuh-SIK-yoo-lus
  text:
    child: Three bundles stacked like shelves under my top surface, linking where-things-are areas at the back with action and planning areas at the front.
    curious: This bundle has three levels. The upper level links the precuneus and superior parietal lobule to supplementary motor, dorsal premotor and prefrontal areas. The middle level connects the area around the angular gyrus to dorsolateral prefrontal cortex. The bottom level ties the supramarginal gyrus to the pars opercularis and ventral premotor cortex. Damage on the right is associated with neglect; on the left, with apraxia and difficulties with speech.
  notes: 'Endpoint convention: bidirectional bundle; the source lists endpoints without direction, so the posterior end is recorded as origin, the anterior end as termination and waypoints as via. SLF I, II and III are held as one tract node. A single study (Thiebaut de Schotten et al. 2011) linked right-sided SLF II lateralization to a visuospatial attention bias.'
  provenance:
    sources:
    - source:catani-2012-b
    - source:thiebaut-de-schotten-2011
    locator: R2 A2 Superior longitudinal fasciculus I, II, III
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:uncinate-fasciculus
  class: Tract
  label: Uncinate Fasciculus
  kind: association
  pronunciation:
    respelling: UN-sin-ate fuh-SIK-yoo-lus
  text:
    child: A hook-shaped bundle that bends from the front of my temporal lobe up into the underside of my frontal lobe.
    curious: This hooked tract joins the front of the temporal lobe, near the amygdala, to the orbitofrontal and ventral prefrontal cortex. It helps tie emotion and memory to value and supports knowledge about people and objects. It is implicated in semantic dementia and in the behavioural form of frontotemporal dementia.
  notes: 'Endpoint convention: bidirectional bundle; the source lists endpoints without direction, so the posterior end is recorded as origin, the anterior end as termination and waypoints as via.'
  provenance:
    sources:
    - source:catani-2012-b
    locator: R2 A3 Uncinate fasciculus
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:cingulum-bundle
  class: Tract
  label: Cingulum Bundle
  kind: association
  aliases:
  - text: cingulum
    kind: common
  pronunciation:
    respelling: SING-gyoo-lum bundle
  text:
    child: A long bundle tucked inside my cingulate belt, joining my front to memory areas on the inner side of my temporal lobe.
    curious: The cingulum travels within the cingulate gyrus. It reaches from frontal cortex beneath the forward end of the corpus callosum back as far as entorhinal and parahippocampal cortex, sending branches to medial prefrontal cortex and the precuneus. It helps with memory, attention and regulating emotion, and belongs to the extended Papez circuit.
  notes: 'Endpoint convention: bidirectional bundle; the source lists endpoints without direction, so the posterior end is recorded as origin, the anterior end as termination and waypoints as via.'
  provenance:
    sources:
    - source:catani-2012-b
    locator: R2 A4 Cingulum bundle; R1 §1.16 Cingulate cortex (Connections)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:inferior-longitudinal-fasciculus
  class: Tract
  label: Inferior Longitudinal Fasciculus
  kind: association
  aliases:
  - text: ILF
    kind: abbreviation
  text:
    child: A long bundle running along my lower side, letting what you see meet what you already know.
    curious: It runs from visual association cortex and the fusiform gyrus forward to the front of the temporal lobe, carrying object information on its way to memory. Damage can cause visual agnosia, face blindness and some forms of pure alexia.
  notes: 'Endpoint convention: bidirectional bundle; the source lists endpoints without direction, so the posterior end is recorded as origin, the anterior end as termination and waypoints as via.'
  provenance:
    sources:
    - source:catani-2012-b
    locator: R2 A5 Inferior longitudinal fasciculus; R1 §1.14 Fusiform gyrus (Connections)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:inferior-fronto-occipital-fasciculus
  class: Tract
  label: Inferior Fronto-Occipital Fasciculus
  kind: association
  debated: true
  aliases:
  - text: IFOF
    kind: abbreviation
  text:
    child: One of my longest bundles, running from the seeing areas at my back all the way to my front.
    curious: 'In humans it links occipital, fusiform and posterior temporal cortex with frontal areas, passing through the extreme and external capsules. It may support meaning and reading: stimulating it during surgery can cause meaning errors. Tracing studies in monkeys disagree about whether they have the same direct bundle, so its story is unresolved.'
  notes: 'Endpoint convention: two-way bundle with undirected source endpoints; back end logged as origin, front end as termination, waypoints as via. Debated: macaque tract-tracing by Schmahmann and Pandya showed no direct fronto-occipital bundle, reporting an extreme capsule fasciculus instead; later monkey work offers a possible homologue. Describe it as a human pathway, monkey counterpart still unsettled.'
  provenance:
    sources:
    - source:catani-2012-b
    - source:schmahmann-pandya-2006
    locator: R2 A6 Inferior fronto-occipital fasciculus
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:frontal-aslant-tract
  class: Tract
  label: Frontal Aslant Tract
  kind: association
  pronunciation:
    respelling: frontal uh-SLANT
  text:
    child: A short, sloping bundle that helps you start talking by linking my top-middle movement area to my speech area.
    curious: This tract slopes downward from the pre-SMA and supplementary motor area to the pars opercularis, part of Broca's area. It helps launch speech and supports verbal fluency. In the short-lived SMA syndrome that may appear after surgery, injury to this tract contributes to less fluent speech and stutter-like signs.
  notes: 'Endpoint convention: source gives no direction; the SMA end is recorded as origin and the Broca''s end as termination.'
  provenance:
    sources:
    - source:catani-2012
    locator: R2 A7 Frontal aslant tract; R1 §1.6 Broca's area (Connections)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:middle-longitudinal-fasciculus
  class: Tract
  label: Middle Longitudinal Fasciculus
  kind: association
  debated: true
  aliases:
  - text: MdLF
    kind: abbreviation
  text:
    child: A bundle running back from my upper temporal lobe whose job is still a puzzle.
    curious: It links the superior temporal gyrus and temporal pole with the angular gyrus, superior parietal lobule, precuneus and occipital cortex. It was described in monkeys in 1984 and in humans in 2009, mostly by tractography. Roles in joining sound and language with attention have been proposed, but its function is uncertain.
  notes: 'Endpoint convention: bidirectional bundle; the source lists endpoints without direction, so the posterior end is recorded as origin, the anterior end as termination and waypoints as via. Debated: function uncertain and evidence mainly from tractography; flag as less established. No firm syndrome.'
  provenance:
    sources:
    - source:seltzer-pandya-1984
    - source:makris-2009
    locator: R2 A8 Middle longitudinal fasciculus; R1 §1.9 Angular gyrus (Connections)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:fornix
  class: Tract
  label: Fornix
  kind: projection
  pronunciation:
    respelling: FOR-niks
  text:
    child: A curved bundle that is the main exit road from my hippocampus, important for remembering what happened to you.
    curious: The fornix is the main output of the hippocampus. It arches forward to the mammillary bodies, the septal nuclei and the front of the thalamus. It belongs to the Papez loop and matters for memories of events; damage, for example during surgery near the third ventricle, can stop new memories forming.
  provenance:
    sources:
    - source:catani-2012-b
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: R2 A9 Fornix; KB anatomy/limbic_system.md
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: tract:corpus-callosum
  class: Tract
  label: Corpus Callosum
  kind: commissural
  pronunciation:
    respelling: KOR-pus kuh-LOH-sum
  text:
    child: A thick band at my centre, made of roughly 200 million fibres, so my two halves can share what each one knows.
    curious: The largest white-matter structure joins matching areas of the two hemispheres. Its front part links prefrontal and orbitofrontal cortex, its body links motor, touch and parietal areas, and its back end, the splenium, links visual areas, the precuneus and parts of the temporal lobe. Cutting it to treat severe epilepsy leaves daily life normal, but lab tests show each half can know things the other does not.
  quantities:
  - name: axonCount
    value: 200000000
    unit: axons
    approx: true
    low: 200000000
    high: 300000000
    sources:
    - source:aboitiz-1992
    - source:tomasch-1954
    - source:nolte-human-brain
    note: About 200 million (Tomasch 1954; Aboitiz et al. 1992, not re-verified); some estimates reach 250 to 300 million; 200 to 250 million is the most cited range.
  - name: length
    value: 10
    unit: cm
    approx: true
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
  notes: 'Endpoint convention: commissural fibres link corresponding areas in the two hemispheres, so endpoints are logged as termination. Sections, anterior to posterior: rostrum, genu, body, splenium. The forceps minor lies at the front and the forceps major at the back.'
  provenance:
    sources:
    - source:aboitiz-1992
    - source:tomasch-1954
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    - source:catani-2012-b
    locator: R2 A10 Corpus callosum; KB anatomy/corpus_callosum.md; R1 §5 Hidden and deep structures (Corpus callosum); R2 F Verification (Corpus callosum axons)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
