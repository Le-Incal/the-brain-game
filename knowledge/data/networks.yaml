- id: tract:cerebellar-peduncles
  class: Tract
  label: Cerebellar Peduncles
  kind: projection
  pronunciation:
    respelling: cerebellar peh-DUNG-kulz
  text:
    child: Thick stalks on each side that plug my little brain into my brain stem, so news can flow in and orders can flow out.
    curious: The superior peduncle carries mostly outgoing fibres, which leave the dentate nucleus, cross over in the midbrain and head for the red nucleus and thalamus. The middle peduncle, the largest one, is purely incoming, bringing fibres from the pontine nuclei to the cerebellar half on the other side. The inferior peduncle, via the medulla, delivers signals from the vestibular nuclei, inferior olive and spinal cord. Injury produces unsteadiness, overshoot and tremor on reaching.
  notes: Superior, middle and inferior peduncles held as one tract node; endpoints labelled per peduncle direction.
  provenance:
    sources:
    - source:kandel-pns
    - source:catani-2012-b
    locator: R2 A15 Cerebellar peduncles; R1 §1.19 Cerebellum (Connections); R1 §2 Pathways and body control (Cerebellum is ipsilateral)
