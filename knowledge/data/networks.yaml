- id: circuit:mesolimbic-reward-pathway
  class: Circuit
  label: Mesolimbic Reward Pathway
  summary: Dopamine neurons of the ventral tegmental area project to the nucleus accumbens, amygdala and hippocampus and on to prefrontal, orbitofrontal and anterior cingulate cortex, signalling when outcomes are better or worse than expected.
  aliases:
  - text: mesolimbic and mesocortical dopamine pathways
    kind: common
  text:
    child: A dopamine pathway from my midbrain that fires up when something turns out better than you expected.
    curious: Dopamine neurons in the ventral tegmental area project to the nucleus accumbens, hippocampus and amygdala, forming the mesolimbic branch, and to anterior cingulate, orbitofrontal and prefrontal cortex, forming the mesocortical branch. These cells burst when a reward comes as a surprise, move their response to cues that signal reward is coming, and dip when a reward they were counting on never shows up. That pattern fits a learning rule borrowed from computer science.
  notes: The mesocortical branch is included here. For reward prediction error, cite Schultz, Dayan and Montague (1997), who linked it to temporal-difference learning.
  provenance:
    sources:
    - source:kandel-pns
    - source:schultz-1997
    locator: R2 B6 Mesolimbic and mesocortical dopamine reward circuit
