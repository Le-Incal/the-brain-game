- id: circuit:ascending-arousal-system
  class: Circuit
  label: Ascending Arousal System
  summary: Brain stem, hypothalamic and basal forebrain cell groups using noradrenaline, serotonin, acetylcholine, histamine, orexin and dopamine that project through the thalamus and directly to cortex to keep it awake.
  text:
    child: Wake-up signals rising from my brain stem and deep centre that turn up the lights across my surface while you are awake.
    curious: The locus coeruleus (noradrenaline), raphe nuclei (serotonin), acetylcholine cells in the pons and basal forebrain, histamine and orexin cells in the hypothalamus, and dopamine cells in the VTA all project, through the thalamus or directly, to the cortex. In sleep a hypothalamic sleep centre shuts them off in a flip-flop switch steadied by orexin. Losing orexin neurons causes narcolepsy type 1.
  notes: Basal forebrain is not a registry structure (see requests). The VLPO 'flip-flop switch' is from Saper and colleagues; historical root Moruzzi and Magoun 1949.
  provenance:
