- id: circuit:cortico-basal-ganglia-loop
  class: Circuit
  label: Cortico-Basal Ganglia Loop
  summary: Parallel loops in which cortex signals the striatum, the basal ganglia output nuclei gate the thalamus, and the thalamus reports back to the same cortex, helping pick one action while holding competitors back.
  aliases:
  - text: cortico-basal ganglia-thalamo-cortical loops
    kind: common
  text:
    child: A loop running from my surface down into my deep movement nuclei and back again, deciding which move gets the green light.
    curious: Five parallel loops (motor, eye movement, dorsolateral prefrontal, orbitofrontal and anterior cingulate) leave the cortex, pass through the striatum, the internal globus pallidus and substantia nigra, and the thalamus, then return. A 'go' route releases the thalamus, a 'stop' route suppresses it, and dopamine tilts the balance. Parkinson's and Huntington's diseases disturb these loops.
  notes: 'Order: 1 cortex, 2 striatum, 3 output nuclei (GPi/SNr), 4 thalamus, then back to cortex. The subthalamic nucleus sits on the indirect and hyperdirect routes, so it has no single order. Direct and indirect pathway neurons co-activate at movement onset (Cui et al. 2013), supporting an action-selection view.'
  provenance:
    sources:
    - source:alexander-1986
    - source:cui-2013
    - source:kandel-pns
    locator: R2 B1 Cortico-basal ganglia-thalamo-cortical loops; R1 §5 Hidden and deep structures (Basal ganglia)
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: circuit:cerebro-cerebellar-loop
  class: Circuit
  label: Cerebro-Cerebellar Loop
  summary: A doubly crossed loop from cortex through the pons to the opposite cerebellar half and back through the dentate nucleus and thalamus to cortex, helping predict and correct movement and thought.
  text:
    child: A loop from my thinking surface to my little brain and back, checking each move and nudging it on target.
    curious: Cortical areas send signals through the cerebral peduncle to the pontine nuclei, which cross into the opposite cerebellar half. Purkinje cells shape the output of the dentate nucleus, which crosses back to the thalamus and on to motor and prefrontal cortex. Because the loop crosses twice, each cerebellar half works with the same side of the body.
  notes: Purkinje cells also receive climbing fibres arising in the inferior olive. Damage produces ataxia and dysmetria, and lesions of the posterior lobe may bring the cerebellar cognitive affective syndrome as well (Schmahmann and Sherman 1998).
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:schmahmann-sherman-1998
    locator: R2 B2 Cerebro-cerebellar loop; R1 §1.19 Cerebellum; R1 §2 Pathways and body control (Cerebellum is ipsilateral)
