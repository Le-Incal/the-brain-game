- id: circuit:central-pattern-generator
  class: Circuit
  label: Central Pattern Generators
  summary: Networks that make rhythmic output without needing rhythmic input, such as spinal circuits for stepping and the pre-Bötzinger complex for breathing, switched on and refined by midbrain, cortex and cerebellum.
  text:
    child: Built-in rhythm makers in my brain stem and your spinal cord that keep you breathing and stepping without any thinking.
    curious: 'Circuits of interneurons in the spinal cord can create the alternating rhythm of walking; in 1911 this was modelled as a pair of half-centres. A midbrain region turns walking on, and the cerebellum and cortex fine-tune it. Breathing has its own generator: the medulla''s pre-Bötzinger complex sets off every inhalation. Opioids suppress this complex, which explains how an overdose can halt breathing.'
  notes: Mechanism only. Failure includes central apnoea and congenital central hypoventilation syndrome (PHOX2B).
  provenance:
    sources:
    - source:kandel-pns
    - source:brown-1911
    - source:smith-1991
