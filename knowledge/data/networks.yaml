- id: network:somatomotor
  class: Network
  label: Somatomotor Network
  atlas: yeo7
  yeoLabel: Somatomotor
  text:
    child: My moving-and-feeling strips, plus my hearing area, which keep in step with one another even when you rest.
    curious: In resting brain scans, the motor and touch strips on either side of the central sulcus, the premotor and supplementary motor areas and the auditory cortex rise and fall together. Coupling of this kind at rest was first shown in motor cortex, in 1995, before whole networks were mapped.
