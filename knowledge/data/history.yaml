- id: myth:learning-styles
  class: Myth
  label: Learning styles
  statement: Students learn best when teaching matches their personal learning style, such as visual or auditory.
  correction:
    child: There is no good evidence that teaching a 'picture learner' only with pictures, or a 'listening learner' only by talking, helps them learn more.
    curious: A major review of the research found no solid evidence that matching lessons to a person's supposed learning style, such as visual or auditory, improves how much they learn. Liking one way of learning is not the same as learning better that way.
