- id: myth:alcohol-kills-brain-cells
  class: Myth
  label: Alcohol kills brain cells
  statement: Drinking alcohol kills brain cells.
  correction:
    child: The real story is more complicated, but heavy drinking still harms the brain by damaging the wiring and branches that connect brain cells.
    curious: 'Studies that counted neurons found no major loss of cortex cells in people with long-term alcoholism. That is not good news, though: alcohol damages white matter and the branching dendrites neurons use to connect. A shortage of thiamine, as in Wernicke-Korsakoff syndrome, does kill neurons. Heavy use harms the brain, just not in the simple way the slogan says.'
