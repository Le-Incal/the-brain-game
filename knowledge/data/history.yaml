- id: person:hippocrates
  class: Person
  label: Hippocrates
  living: false
  knownFor: Ancient Greek physician whose treatise On the Sacred Disease argued that epilepsy is a brain disorder rather than a divine one, and that the brain is the seat of thought and feeling.
