- id: condition:parkinsons-disease
  class: Condition
  label: Parkinson's Disease
  kind: neurodegenerative
  informationalOnly: true
  audience: teen
  text:
    child: An illness where some movement-helping cells deep in my midbrain are slowly lost, so moving becomes shaky, slow and stiff.
    curious: Parkinson's disease happens when dopamine-making neurons in the substantia nigra of my midbrain are gradually lost. Those cells feed the basal ganglia, which help start and smooth out movement. Tremor, slowness and stiffness usually show up only after many of the cells are already gone. Clumps of a protein called alpha-synuclein, known as Lewy bodies, are another hallmark.
  provenance:
