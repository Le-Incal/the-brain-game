- id: myth:left-right-brain
  class: Myth
  label: Left-brained and right-brained people
  statement: Each person is either left-brained (logical) or right-brained (creative).
  correction:
    child: Nobody is left-brained or right-brained. Your two halves team up on almost everything, even though each half is a bit better at certain jobs.
    curious: 'A study of more than a thousand people found no sign that anyone is dominated by one whole hemisphere. Some skills do lean to one side: language usually leans left, while faces and the melody of speech lean right. Both halves still work together constantly. Split-brain research was later stretched into this personality myth.'
