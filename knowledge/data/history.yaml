- id: myth:glia-ten-to-one
  class: Myth
  label: Glia outnumber neurons ten to one
  statement: Glial cells outnumber neurons in the brain ten to one.
  correction:
    child: Your brain has roughly one glial helper cell for every neuron, not ten.
    curious: Careful cell counts show that the whole brain holds roughly as many glial cells as neurons, a ratio of about one to one. The balance does shift between brain areas, but the old ten-to-one figure does not hold up anywhere in the overall count.
  provenance:
    sources:
    - source:azevedo-2009
    - source:von-bartheld-2016
    locator: 'R1 §17a Consolidated myths list #8'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: myth:cerebellum-only-balance
  class: Myth
  label: The cerebellum only controls balance
  statement: The cerebellum's only job is balance.
  correction:
    child: Your cerebellum helps you balance, but it also helps you learn skills, keep time, use words and handle feelings.
    curious: Balance and coordination are classic cerebellum jobs, but far from the whole story. It is central to motor learning and precise timing. People with damage to its posterior lobe can have problems with planning, spatial thinking, language and emotion, a pattern called the cerebellar cognitive affective syndrome.
  provenance:
    sources:
    - source:schmahmann-sherman-1998
    locator: 'R1 §17a Consolidated myths list #9; R1 §1.19 Cerebellum'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: myth:smell-through-thalamus
  class: Myth
  label: Smell passes through the thalamus like other senses
  statement: Smell signals pass through the thalamus before reaching the cortex, just like the other senses.
  correction:
    child: Smell takes a shortcut! It travels from your nose straight to a smell area of the brain without stopping at the main relay station first.
    curious: 'Every other sense stops at the thalamus, the brain''s relay hub, on its way to the cortex. Smell is different: signals from the olfactory bulb go directly to the piriform cortex, the primary smell area. A secondary route does pass through the thalamus to reach the orbitofrontal cortex, where smell joins taste to build flavour, but the first stop skips the thalamus.'
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    - source:gottfried-2010
    locator: 'R1 §17a Consolidated myths list #10; R1 §8 Smell; R1 §1.15a Piriform cortex'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: myth:adult-neurogenesis-certainty
  class: Myth
  label: Adults definitely do, or definitely don't, grow new neurons
  statement: 'Science has settled whether adult humans grow new neurons: either they never do, or they definitely make many.'
  correction:
    child: Scientists are still working this out. Grown-ups may make a few new neurons in a memory area, but nobody knows yet how many, or how much it matters.
    curious: 'Some studies have found signs of new neurons forming in the adult hippocampus, including a 2025 study that spotted dividing precursor cells in adults up to age 78. Others found almost none, and results vary widely between people and methods. The fair summary: adults may make some new hippocampal neurons, but how many, and whether they matter for memory, is still debated.'
  provenance:
    sources:
    - source:eriksson-1998
    - source:spalding-2013
    - source:sorrells-2018
    - source:boldrini-2018
    - source:moreno-jimenez-2019
    - source:dumitru-2025
    locator: 'R1 §17a Consolidated myths list #11; R1 §12 Adult neurogenesis (DEBATED)'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
- id: myth:phineas-gage-permanent
  class: Myth
  label: Phineas Gage was ruined for life
  statement: After an iron rod passed through his head, Phineas Gage became a permanent wreck.
  correction:
    child: Phineas Gage changed after his accident, but he recovered a lot. Years later he drove stagecoaches, a job that needed planning and people skills.
    curious: 'In 1848 a tamping iron passed through Gage''s left frontal lobe, and his doctor reported a major personality change. That part gets retold often. Less often told: historians found he later worked for years as a stagecoach driver in Chile, a job that demands planning and social skill, and a doctor there reported no impairment of his mind. His story is about recovery as much as damage.'
  provenance:
    sources:
    - source:macmillan-lena-2010
    locator: 'R1 §17a Consolidated myths list #12; R1 §10 Phineas Gage'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
  standaloneCorrection: true
- id: myth:trillion-odors
  class: Myth
  label: Humans can smell a trillion odours
  statement: People can tell apart one trillion different smells.
  correction:
    child: Nobody knows exactly how many smells you can tell apart. It is a big number, but the 'one trillion' claim did not hold up.
    curious: A 2014 study estimated that people can tell apart about a trillion odours. Other scientists then showed that the method behind that figure could produce almost any number, depending on its assumptions. So the true count is unknown. What can be said is that it is large.
  provenance:
    sources:
    - source:meister-2015
    - source:gerkin-castro-2015
    locator: 'R1 §17a Consolidated myths list #13; R1 §8 Smell (Disputed claim)'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
  standaloneCorrection: true
- id: myth:gut-serotonin-mood
  class: Myth
  label: Gut serotonin controls your mood
  statement: Serotonin made in your gut controls your mood.
  correction:
    child: Most of your body's serotonin is made in your belly, but it cannot get into your brain. Your brain makes its own.
    curious: Most of the body's serotonin, about 90 to 95 percent, is made in the gut, but that serotonin cannot cross the blood-brain barrier, so it never reaches brain cells directly. The brain's own serotonin comes from the raphe nuclei in the brain stem. Gut and brain do communicate, through nerves such as the vagus, immune signals and chemicals made by gut microbes, and those links are an active research area.
  provenance:
    sources:
    - source:purves-neuroscience
    - source:blumenfeld-neuroanatomy
    - source:nolte-human-brain
    locator: 'R1 §17a Consolidated myths list #14; R1 §13 Blood supply (Blood-brain barrier); KB SOURCES_AND_CORRECTIONS.md (Neurotransmitters)'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
    reviewNote: 'R1 §17a #14 cites no work; sources are those of R1 §13 and the KB corrections log.'
- id: myth:tongue-taste-map
  class: Myth
  label: The tongue has a taste map
  statement: Different zones of the tongue detect different tastes, such as sweet at the tip and bitter at the back.
  correction:
    child: There is no taste map. All five basic tastes can be picked up all across your tongue.
    curious: The famous tongue map grew out of a misreading of a 1901 study and was popularised in 1942. In fact, sweet, sour, salty, bitter and umami are all detected across the tongue. Taste buds send their signals through three cranial nerves to the brain stem, then on to the taste cortex in the insula.
  notes: R1 traces the myth to a misreading of Hänig (1901), popularised by Boring (1942).
  provenance:
    sources:
    - source:kandel-pns
    - source:purves-neuroscience
    locator: 'R1 §17a Consolidated myths list #15; R1 §8 Taste (Myth)'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
  standaloneCorrection: true
- id: myth:brain-done-at-fixed-age
  class: Myth
  label: The brain is finished at 18, or at exactly 25
  statement: The brain is fully developed at age 18, or at exactly age 25.
  correction:
    child: Your brain keeps growing and changing well into adulthood. There is no single birthday when it is finished.
    curious: The planning areas at the front of the brain mature last, and wiring keeps changing through the twenties. The famous age of 25 stretches beyond the original data, which only covered people up to 21. A 2025 study of more than 4,000 people found a major turning point in whole-brain wiring around age 32. There is no single 'done' birthday.
  provenance:
    sources:
    - source:gogtay-2004
    - source:mousley-2025
    - source:somerville-2016
    locator: 'R1 §17a Consolidated myths list #16; R1 §12 Adolescence and the PFC'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
  standaloneCorrection: true
- id: myth:brain-training-games
  class: Myth
  label: Brain-training games make you smarter overall
  statement: Playing brain-training games makes you smarter in general.
  correction:
    child: Brain games make you better at those games. They do not seem to make you better at schoolwork or everyday thinking.
    curious: A major review found that brain-training games reliably improve performance on the trained tasks themselves. Evidence that those gains carry over to everyday thinking, school or work is weak. Getting good at a game mostly makes you good at that game.
  provenance:
    sources:
    - source:simons-2016
    locator: 'R1 §17a Consolidated myths list #17'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
  standaloneCorrection: true
- id: myth:brain-feels-pain
  class: Myth
  label: The brain feels pain when it is cut
  statement: Cutting into the brain itself is painful.
  correction:
    child: Brain tissue has no pain sensors, so it cannot feel being touched. That is why some people stay awake during brain surgery!
    curious: The brain tissue itself has no pain receptors. That is why surgeons can operate while a patient is awake, as Wilder Penfield did when he mapped the cortex during epilepsy surgery. Headaches come from the brain's coverings, the meninges, and from its blood vessels, which do have pain receptors.
  provenance:
    sources:
    - source:purves-neuroscience
    - source:nolte-human-brain
    - source:statpearls
    - source:penfield-boldrey-1937
    locator: 'R1 §17a Consolidated myths list #18; R1 §7 Meninges; R1 §3 Origins'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
    reviewNote: 'R1 §17a #18 cites no work; sources are those of R1 §7 and R1 §3.'
  standaloneCorrection: true
- id: myth:living-brain-grey
  class: Myth
  label: Living brains are grey
  statement: A living brain is grey.
  correction:
    child: A living brain is pinkish-beige because blood flows all through it. Brains only look grey after they have been preserved.
    curious: Pictures of grey brains usually show preserved specimens. Inside a living head the brain is pinkish-beige, coloured by its rich blood supply. The term 'grey matter' describes how cell-body-rich tissue looks after preservation.
  provenance:
    sources:
    - source:qbi-brain-basics
    - source:kandel-pns
    - source:purves-neuroscience
    - source:nolte-human-brain
    locator: 'R1 §17a Consolidated myths list #19; KB anatomy/central_nervous_system.md (Common questions)'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
    reviewNote: 'R1 §17a #19 cites no work; sources are the works listed by KB anatomy/central_nervous_system.md.'
  standaloneCorrection: true
- id: myth:brain-cannot-recover
  class: Myth
  label: A damaged brain can never recover
  statement: Once the brain is damaged, lost abilities never come back.
  correction:
    child: Brains can heal in surprising ways. After an injury, other parts can learn to take over some jobs, especially with lots of practice.
    curious: 'Neuroplasticity, the brain''s ability to rewire, allows real recovery after stroke and other injuries. Recovery is usually fastest in the first weeks to months, and therapy helps: one method restrains the stronger arm so the weaker one gets practice, and a large trial showed it works. Recovery is often incomplete, but ''never'' is wrong.'
  provenance:
    sources:
    - source:wolf-2006
    - source:kandel-pns
    - source:purves-neuroscience
    locator: 'R1 §17a Consolidated myths list #20; R1 §14 Rehabilitation and plasticity; KB physiology/synaptic_plasticity.md (Recovery)'
    license: own
    method: ai_extracted
    assertedBy: extractor:claude
    assertedOn: 2026-10-02
    status: proposed
    reviewNote: 'R1 §17a #20 cites no work; sources are those of R1 §14 and the KB plasticity file.'
