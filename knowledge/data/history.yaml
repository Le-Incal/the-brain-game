- id: myth:mozart-effect
  class: Myth
  label: The Mozart effect
  statement: Listening to classical music, especially Mozart, makes babies smarter.
  correction:
    child: Listening to Mozart does not make babies smarter. The famous study tested college students, and its small effect faded quickly.
    curious: The original 1993 study tested college students, not babies, and found only a brief bump in scores on spatial puzzles after listening to Mozart. Later reviews that pooled many studies found little or no real effect. Music is worth enjoying for its own sake, but it is not a shortcut to a higher IQ.
