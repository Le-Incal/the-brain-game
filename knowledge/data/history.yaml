- id: myth:hundred-billion-neurons
  class: Myth
  label: The brain has 100 billion neurons
  statement: The human brain contains 100 billion neurons.
  correction:
    child: Careful counting found about 86 billion neurons in a human brain, not 100 billion. That is still an enormous number!
    curious: When researchers counted the neurons in adult brains, they found about 86 billion, with individual brains ranging from roughly 79 to 95 billion. The popular figure of 100 billion falls outside that measured range. The counts came from only four brains, so 86 billion is best treated as a good estimate rather than an exact total.
