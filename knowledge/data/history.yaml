- id: myth:bigger-brain-smarter
  class: Myth
  label: A bigger brain means a smarter person
  statement: The bigger your brain, the smarter you are.
  correction:
    child: Size isn't everything. Elephants and whales have bigger brains than people, and among humans brain size tells you very little about how clever someone is.
    curious: Across many studies, brain size and intelligence scores are only weakly to modestly linked; one meta-analysis put the correlation at about 0.24, which leaves most of the differences between people unexplained. Elephants and whales also have larger brains than humans do.
