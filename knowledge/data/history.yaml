requests:
- wanted: structure:anterior-temporal-lobe
  label: Anterior temporal lobe
  why: R1 §16 says concussion especially affects the OFC and anterior temporal lobes, and R1 §4 names the anterior temporal lobes as the semantic hub; structure:temporal-pole is narrower, so no AFFECTS edge was asserted.
openQuestions:
- claim: Brenda Milner died in 2025 at age 106.
  locator: R1 §10 Brenda Milner; R1 Caveats
  reason: Contradicted by R2 Part F (living, McGill 2026 booklet). Recorded as living per R2 and the brief. R1 §10 needs correcting. Her birth year 1918 appears in R1 §10 and R2 F, but R2's exact birth date rests on Wikipedia; confirm in a non-Wikipedia source.
- claim: Alzheimer's disease impairs episodic memory.
  locator: R1 §16 Alzheimer's disease; R1 §12 Dementia
  reason: Not stated explicitly in the sources (they describe dementia and hippocampal/entorhinal neuron loss). IMPAIRS assertion held back; add once a cited source states it.
- claim: Living status of Vesalius, Descartes, Willis, Leborgne, Lelong, Hodgkin, Huxley, Scoville, Sperry, Harlow, Papez, Heschl, Ehrlich, Lewandowsky, Goldmann and Stern.
  locator: R1 §10; R1 §5; R2 B4; KB anatomy/blood_brain_barrier.md
  reason: 'living: false is inferred from the historical context; the sources give no death year. Steward to confirm and supply life dates from a cited source.'
- claim: Given names and dates for person:papez and person:heschl.
  locator: R2 B4; R1 §1.11
  reason: Sources give surnames only, so the nodes use surname-only ids and labels. Steward to supply full names from a cited source (not from memory).
- claim: Eponym persons for Parkinson's disease, Alzheimer's disease, Bell's palsy, Brown-Séquard syndrome and Urbach-Wiethe disease.
  locator: R1 §16; R1 §6; R1 §2; R1 §5; R1 §17b
  reason: The sources say nothing about these people beyond the eponym, so no Person nodes or NAMED_AFTER edges were created.
- claim: 'Dated history without a usable year or registry target: Ehrlich dye work (1880s), Golgi stain (around 1873), Descartes Treatise of Man (1662/1664), Vicq d''Azyr depicting the central sulcus (no year), Leuret naming it (1839), Gennari stria (late 1700s), Dejerine alexia with agraphia (1891), Sherrington ''synapse'' (1897), Brodmann map (1909), Moruzzi and Magoun (1949), Kornhuber and Deecke (1965).'
  locator: R1 §10; R1 §1.4; R1 §1.9; R2 B11; R2 C2; KB anatomy/blood_brain_barrier.md
  reason: DESCRIBED needs an exact year and a node to point at; these were left out or kept in person knownFor text.
- claim: Franciscus Sylvius described the lateral fissure in 1641.
  locator: R1 §10 Franciscus Sylvius
  reason: R1 says Caspar Bartholin published the description in 1641 and credited Sylvius. Asserted for Sylvius with a debateNote; steward to decide whether Bartholin should also get a DESCRIBED edge.
- claim: Blood-brain barrier history (Lewandowsky 1900, Goldmann 1909 and 1913, Stern around 1921).
  locator: KB anatomy/blood_brain_barrier.md; KB SOURCES_AND_CORRECTIONS.md
  reason: The KB names only file-level sources and the corrections log cites 'history of medicine'. Cited BrainFacts provisionally; needs a proper historical source.
- claim: Core descriptions of Alzheimer's disease (R1 §16) and of meningioma, glioblastoma and medulloblastoma (R1 §15).
  locator: R1 §15; R1 §16
  reason: R1 names no work for these statements (only FDA and CBTRUS items, which are out of scope). Kandel and Louis 2021 cited provisionally; needs the citation pass.
- claim: conditionKind vocabulary gaps.
  locator: schema/vocabulary.yaml
  reason: Hydrocephalus (CSF disorder), Bell's palsy (cranial nerve), Urbach-Wiethe (genetic) forced to 'syndrome'; multiple sclerosis (immune, demyelinating) forced to 'neurodegenerative'. Consider adding terms.
- claim: AFFECTS lacks a lateralization prop.
  locator: schema/relations.yaml; R1 §1.8, §1.9, §1.14, §14
  reason: Hemispatial neglect is right-hemisphere and prosopagnosia right or bilateral, but AFFECTS edges to region:8, region:9 and the fusiform gyrus cannot say so. Consider an optional lateralization prop.
- claim: Epilepsy affects the piriform cortex and the hippocampus.
  locator: R1 §1.15a Piriform cortex (Damage); R2 B8 (hippocampal sclerosis)
  reason: Both claims concern temporal lobe epilepsy specifically, not epilepsy in general. Consider a condition:temporal-lobe-epilepsy node.
- claim: Ischemic stroke IMPAIRS motor control and vision.
  locator: R1 §1.5; R1 §1.17; R1 §14
  reason: The sources speak of 'MCA strokes' and 'PCA strokes' without saying ischemic; attached to ischemic-stroke as the territory-blockage case. Confirm.
- claim: Citation details for Beyerstein 1999, Pietschnig 2015, Chabris 1999, Pietschnig 2010, von Bartheld 2016, Finger (Origins of Neuroscience) and Papez 1937.
  locator: R1 §17a; R1 §10; R2 B4
  reason: R1/R2 give author and year only; Source type 'peer_reviewed' assumed. Confirm Beyerstein 1999 is not a pop-science source (rule 6). Ids source:finger-origins and source:von-bartheld-2016 are ad hoc.
- claim: 'Myths #14, #18, #19, #20 corrections.'
  locator: R1 §17a
  reason: R1 §17a cites no work for these; sources were taken from the R1 section the item points to or from the KB file that states the correction.
- claim: 'Conditions in the sources that are not in the registry: cerebellar cognitive affective syndrome, Korsakoff syndrome, Huntington''s disease, conduction aphasia, Gerstmann syndrome, Balint syndrome, akinetopsia, achromatopsia, Wallenberg syndrome, Weber syndrome, Parinaud syndrome, apraxia of speech, SMA syndrome.'
  locator: R1 §1; R1 §5; R2 A1; R2 B1; R2 B4
  reason: Not created (outside the registry list). Candidates for a later pass.
