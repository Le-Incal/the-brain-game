  informationalOnly: true
  audience: teen
  text:
    child: An illness that slowly damages brain cells, starting in my memory areas. It is caused by disease, not by simply getting older.
    curious: Alzheimer's disease is the most common cause of dementia, a decline serious enough to get in the way of independent daily life. Amyloid plaques and tangles of tau protein build up, and neurons are lost, beginning in the entorhinal cortex and hippocampus. The precuneus and posterior cingulate show early drops in activity. Dementia comes from disease; it is not an unavoidable part of growing old.
