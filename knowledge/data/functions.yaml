requests:
- wanted: structure:secondary-somatosensory-cortex
  label: Secondary somatosensory cortex (S2)
  why: R1 §4 lists S2 as contributing to touch and pain; no registry id, so those edges were held back.
- wanted: structure:frontal-operculum
  label: Frontal operculum (gustatory cortex)
  why: R1 §4 and §8 list the frontal operculum with the anterior insula as primary for taste; only the insula edge was created.
- wanted: structure:basal-forebrain
  label: Basal forebrain
  why: R1 §4 and R2 B11 list it as contributing to sleep and arousal; edge held back.
- wanted: structure:posterior-parietal-cortex
  label: Posterior parietal cortex
  why: R1 §4 names PPC for working memory, touch, vision and navigation; mapped to region:8 for now, which spans only part of PPC.
- wanted: structure:temporoparietal-junction
  label: Temporoparietal junction (TPJ)
  why: R1 §4 names right TPJ (attention) and TPJ (social cognition); mapped to region:9 following R2 E3.
- wanted: structure:retrosplenial-cortex
  label: Retrosplenial cortex
  why: R1 §4 names it for spatial navigation; folded into posterior-cingulate-cortex following R1 §1.16.
- wanted: structure:nucleus-of-the-solitary-tract
  label: Nucleus of the solitary tract (NTS)
  why: R1 §4 names NTS for taste, hunger and breathing; mapped to medulla-oblongata.
- wanted: structure:parietoinsular-vestibular-cortex
  label: Parietoinsular vestibular cortex
  why: R1 §4 Balance contributor; mapped to insula with approximate confidence.
openQuestions:
- claim: Per-row citations for R2 E2 function table
  locator: R2 E2
  reason: E2 rows cite no works. Sources on E2-derived edges were taken from the matching R1 §1 region Sources lines (or the Kandel/Purves/Nolte/Blumenfeld textbooks R1 names). Steward should confirm attribution.
- claim: Tip-of-the-tongue, absolute pitch and semantic priming phenomena
  locator: wordbank
  reason: No coverage in R1, R2 or KB. Nodes created only so the word-bank EXPRESSES edges resolve; provenance.sources is empty (fails requiresSources) and no EXPLAINED_BY edges were made. Needs a cited source.
- claim: Blindsight is attributed to Weiskrantz
  locator: R1 §1.17 Damage
  reason: No year given, so no source:weiskrantz-YYYY id could be minted; edge cites the R1 §1.17 textbook list instead.
- claim: Dehaene triple-code model for number processing in the IPS
  locator: R1 §4 Math and number
  reason: No year given; numerical-cognition edges cite textbooks only. Add the Dehaene source when the year is confirmed.
- claim: Ten R1 vs R2 role conflicts kept as --r1/--r2 pairs
  locator: R2 E2; R1 §4
  reason: working-memory/region-8, speech-production/region-5, writing/region-3, writing/region-8, writing/region-9, attention/region-9, motor-control/region-19, vision/region-18, music/region-11, music/region-12. Not resolved; no CONTESTS edges made because confidence is not 'debated'.
- claim: Soft conflicts across different targets
  locator: R2 E2; R1 §4
  reason: E2 gives region:16 as PRIMARY for emotion (imaging) while R1 §4 gives ACC (part of 16) as CONTRIBUTING; E2 gives region:1 PRIMARY for decision-making while R1 §4 gives DLPFC CONTRIBUTING and vmPFC PRIMARY. Kept as separate edges.
- claim: Mappings of report terms to canon
  locator: R1 §4; R2 E2
  reason: PPC and 'parietal cortex' -> region:8; TPJ -> region:9 (per R2 E3); ventral frontal cortex -> inferior-frontal-gyrus; occipital face area -> region:18; 'rostral 12' and anterior temporal lobe -> temporal-pole; retrosplenial -> posterior-cingulate-cortex; NTS -> medulla-oblongata; PIVC -> insula; '15' midbrain -> structure:midbrain; '15 PAG' -> periaqueductal-gray; frontopolar cortex -> region:1; right Broca homolog -> inferior-frontal-gyrus (right). Review each.
- claim: Debates recorded as approximate + debateNote rather than 'debated'
  locator: R1 §3, §4, §1.13, §1.14; R2 B5, E3
  reason: Consciousness, semantic hub, emotion as network states, pain matrix and dACC selectivity, Exner's area, phantom limb remapping (Schone 2025), Wernicke boundaries, fear center (LeDoux and Pine 2016), FFA expertise. Upgrade to stance/CONTESTS pairs if the steward wants them queryable as debates.
- claim: R2 E3 Neurosynth qualitative associations
  locator: R2 E3
  reason: 'Not imported: R2 says verify each map live before quoting, and Neurosynth data is ODbL share-alike (R2 E5).'
- claim: R1 §4 Personality (distributed) and PFC rule switching / impulse inhibition, right VLPFC response inhibition (Aron et al. 2004)
  locator: R1 §4 Personality; R1 §1.1
  reason: Not in the Function registry and no word needs them, so no Function nodes were created.
- claim: Cognitive Atlas xrefs
  locator: R2 E2
  reason: 'R2 reports working-memory sub-concept ids and the parent ''memory'' id as verified on cognitiveatlas.org; recorded as xrefs with verified: false pending our own check.'
- claim: Word target region not supported by the expressed function(s)
  locator: wordbank
  reason: TIP-OF-THE-TONGUE (target 13) -> phenomenon:tip-of-the-tongue; ABSOLUTE PITCH (target 11) -> phenomenon:absolute-pitch; SEMANTIC PRIMING (target 14) -> phenomenon:semantic-priming; LOCKED-IN SYNDROME (target 20) -> condition:locked-in-syndrome. The three phenomena are unsourced; LOCKED-IN SYNDROME points at a Condition whose AFFECTS edges belong to the history agent. No edges were invented to force agreement.
